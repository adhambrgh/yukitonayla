<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momen Kita — Video</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@600;700&family=Quicksand:wght@500;600;700&display=swap');

  :root{
    --ocean-deep:#00416B;
    --ocean-mid:#0077B6;
    --ocean-bright:#48CAE4;
    --ocean-pale:#CAF0F8;
    --coral:#FF6B6B;
    --seafoam:#2A9D8F;
    --gold:#E3AB6B;
    --ink:#002D4A;
    --ink-soft:#3C6478;
    --device:#072F4C;
    --device-deep:#04203A;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  body{
    min-height:100vh; position:relative; overflow-x:hidden;
    display:flex; align-items:flex-start; justify-content:center;
    padding:16px 16px 44px;
    font-family:'Quicksand', sans-serif; color:#fff;
    background:
      url('./assets/images/2.jpg') center / cover no-repeat,
      linear-gradient(180deg, rgba(0,65,107,.6) 0%, rgba(0,119,182,.5) 52%, rgba(72,202,228,.42) 100%);
  }

  .ocean-rays{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 0%, rgba(202,240,248,.28) 0%, rgba(72,202,228,.08) 46%, transparent 72%);
  }
  .field{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }

  .bubble{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.6) 0%, rgba(202,240,248,.25) 45%, rgba(72,202,228,.1) 75%, transparent 100%);
    border:1px solid rgba(255,255,255,.35);
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{ transform:translateY(105vh) scale(.3); opacity:0; }
    15%{ opacity:.75; }
    50%{ transform:translateY(50vh) translateX(10px) scale(.9); }
    85%{ opacity:.75; }
    100%{ transform:translateY(-15vh) translateX(-8px) scale(1.1); opacity:0; }
  }

  .drifter{
    position:absolute; object-fit:contain; opacity:.6;
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{ transform:translate3d(-16vw,0,0); }
    50%{ transform:translate3d(104vw,-20px,0); }
    100%{ transform:translate3d(-16vw,14px,0); }
  }

  .spark{
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:var(--gold); animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{ opacity:.15; } 50%{ opacity:.85; } }

  .deco{
    position:fixed; z-index:1; pointer-events:none;
    filter:drop-shadow(0 10px 18px rgba(0,30,70,.35));
  }
  .deco img{ display:block; width:100%; height:auto; }

  /* Nav persisten: selalu terjangkau tanpa scroll, ini yang bikin
     "tidak bisa ke halaman selanjutnya" hilang. */
  .topnav{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    width:100%; max-width:420px; margin:0 auto 14px; padding:8px 10px;
    background:rgba(4,32,58,.72); border:1px solid rgba(202,240,248,.18);
    border-radius:999px; backdrop-filter:blur(6px);
  }
  .topnav a{
    display:flex; align-items:center; gap:5px; flex:0 1 auto; min-width:0;
    padding:7px 13px; border-radius:999px; text-decoration:none;
    font-size:12.5px; font-weight:700; white-space:nowrap;
    background:rgba(255,255,255,.1); color:var(--ocean-pale);
    border:1px solid rgba(202,240,248,.22);
    transition:background .18s ease, transform .15s ease;
  }
  .topnav a:hover{ background:rgba(72,202,228,.3); transform:translateY(-1px); }
  .topnav a:focus-visible{ outline:3px solid rgba(255,201,143,.9); outline-offset:2px; }
  .topnav svg{ width:14px; height:14px; flex-shrink:0; }
  .topnav a span{ overflow:hidden; text-overflow:ellipsis; }

  /* Hemat sumber daya saat video diputar: matikan semua dekorasi
     yang sebelumnya bikin lag di HP. */
  body.is-playing .field,
  body.is-playing .ocean-rays{ display:none; }
  body.is-playing .deco,
  body.is-playing .drip{ animation-play-state:paused; }
  body.is-playing .deco{ filter:none; }

  .deco.d1{ width:66px; top:7%;  left:5%;  transform:rotate(-9deg); animation:bobA 7s ease-in-out infinite; }
  .deco.d2{ width:54px; top:13%; right:6%; transform:rotate(8deg);  animation:bobB 8.5s ease-in-out infinite; }
  .deco.d3{ width:48px; bottom:16%; left:4%; transform:rotate(6deg); animation:bobB 9.5s ease-in-out infinite reverse; }
  .deco.d4{ width:58px; bottom:9%; right:5%; transform:rotate(-7deg); animation:bobA 8s ease-in-out infinite reverse; }
  .deco.d5{ width:40px; top:44%; right:2%; transform:rotate(5deg);  animation:bobA 10s ease-in-out infinite; }
  .corner{ position:absolute; width:40px; pointer-events:none; z-index:2; }
  .corner.tl{ top:-10px; left:-10px; }
  .corner.tr{ top:-10px; right:-10px; }
  .corner.bl{ bottom:-10px; left:-10px; }
  .corner.br{ bottom:-10px; right:-10px; }
  @keyframes bobA{ 0%,100%{ transform:translateY(0) rotate(-9deg); } 50%{ transform:translateY(-14px) rotate(2deg); } }
  @keyframes bobB{ 0%,100%{ transform:translateY(0) rotate(8deg); } 50%{ transform:translateY(-12px) rotate(-3deg); } }

  /* align-items:flex-start + margin:auto centering supaya konten panjang
     tidak pernah terjepit/terpotong di layar pendek. */
  .stage{ position:relative; z-index:2; width:100%; max-width:340px; margin:auto; }

  .device{
    position:relative;
    background:linear-gradient(180deg, var(--device) 0%, var(--device-deep) 100%);
    border-radius:26px 26px 0 0;
    padding:14px 14px 20px;
    box-shadow:0 26px 46px -20px rgba(0,0,0,.55);
  }
  .device::before{
    content:''; position:absolute; top:6px; left:50%; transform:translateX(-50%);
    width:52px; height:4px; border-radius:99px; background:rgba(202,240,248,.28);
  }

  .screen{
    position:relative; width:100%; aspect-ratio:1/0.95;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(72,202,228,.22), transparent 62%),
      linear-gradient(180deg, #062338 0%, #030F1C 100%);
    border:1px solid rgba(72,202,228,.28);
    border-radius:14px; overflow:hidden; margin-bottom:16px;
  }
  .screen video{
    width:100%; height:100%; object-fit:cover; display:block;
    background:transparent;
  }

  /* Overlay status di atas video: putar / memuat / buffering / error */
  .veil{
    position:absolute; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:11px; padding:18px; text-align:center;
    background:rgba(3,15,28,.42);
  }
  .veil[hidden]{ display:none; }

  .play-fab{
    display:flex; align-items:center; justify-content:center;
    width:74px; height:74px; padding:0; cursor:pointer;
    border:none; border-radius:50%; color:#fff;
    background:linear-gradient(135deg, var(--ocean-bright) 0%, var(--ocean-mid) 100%);
    box-shadow:0 14px 30px -10px rgba(0,0,0,.6);
    transition:transform .18s ease, filter .18s ease;
  }
  .play-fab:hover{ transform:scale(1.07); filter:brightness(1.1); }
  .play-fab:active{ transform:scale(.95); }
  .play-fab:focus-visible{ outline:3px solid rgba(255,201,143,.95); outline-offset:3px; }
  .play-fab svg{ width:32px; height:32px; margin-left:4px; }

  .veil-msg{ margin:0; font-size:12.5px; line-height:1.55; color:rgba(202,240,248,.85); }
  .veil-msg b{ color:var(--ocean-bright); }

  .spinner{
    width:34px; height:34px; border-radius:50%;
    border:3px solid rgba(202,240,248,.28); border-top-color:var(--ocean-bright);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .retry-btn{
    padding:9px 18px; cursor:pointer; border-radius:999px;
    border:1.5px solid rgba(202,240,248,.5);
    background:rgba(72,202,228,.22); color:#fff;
    font-family:'Quicksand', sans-serif; font-size:13px; font-weight:700;
    transition:background .18s ease;
  }
  .retry-btn:hover{ background:rgba(72,202,228,.38); }

  /* Spinner kecil di tengah saat buffering di tengah playback */
  .buffering{
    position:absolute; inset:0; z-index:3; pointer-events:none;
    display:none; align-items:center; justify-content:center;
    background:rgba(3,15,28,.28);
  }
  .buffering.on{ display:flex; }

  .upload-btn{
    display:block; margin:10px auto 0; padding:8px 14px;
    background:none; border:1px solid rgba(202,240,248,.28); border-radius:999px;
    color:rgba(202,240,248,.7); font-family:'Quicksand', sans-serif;
    font-size:11.5px; font-weight:600; letter-spacing:.06em; cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  .upload-btn:hover{ background:rgba(72,202,228,.18); color:var(--ocean-pale); }
  .upload-btn:focus-visible{ outline:3px solid rgba(255,201,143,.9); outline-offset:2px; }

  .title{
    margin:0 0 12px; min-height:1.4em;
    font-family:'Caveat', cursive; font-weight:700; font-size:24px; line-height:1.3;
    color:#fff; text-align:center; outline:none;
    border-radius:6px; transition:background .2s ease;
  }
  .title:hover,
  .title:focus{ background:rgba(72,202,228,.14); }

  .progress-track{
    position:relative; width:100%; height:16px;
    display:flex; align-items:center; cursor:pointer; touch-action:none;
  }
  .progress-track::before{
    content:''; position:absolute; left:0; right:0; top:50%;
    height:5px; margin-top:-2.5px; border-radius:99px;
    background:rgba(255,255,255,.22);
  }
  .progress-fill{
    position:absolute; left:0; top:50%; height:5px; margin-top:-2.5px; width:0%;
    background:var(--ocean-pale); border-radius:99px;
  }
  .progress-thumb{
    position:absolute; top:50%; left:0%; width:14px; height:14px; border-radius:50%;
    background:#fff; transform:translate(-50%, -50%);
    box-shadow:0 1px 4px rgba(0,0,0,.45);
  }

  .time-row{
    display:flex; justify-content:space-between;
    font-size:12px; font-weight:600; color:rgba(202,240,248,.75); margin:2px 0 12px;
  }

  .controls-row{
    display:flex; align-items:center; justify-content:center; gap:32px; margin-bottom:14px;
  }
  .ctrl-btn{
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; padding:6px; cursor:pointer; color:#EAF6FA;
    border-radius:50%; transition:background .2s ease, transform .15s ease;
  }
  .ctrl-btn svg{ width:24px; height:24px; display:block; }
  .ctrl-btn.play{ background:rgba(72,202,228,.18); padding:10px; }
  .ctrl-btn.play svg{ width:22px; height:22px; }
  .ctrl-btn:hover{ background:rgba(72,202,228,.28); }
  .ctrl-btn:active{ transform:scale(.92); }
  .ctrl-btn:disabled{ opacity:.32; cursor:not-allowed; }

  .volume-row{ display:flex; align-items:center; gap:10px; }
  .vol-icon{
    width:18px; height:18px; color:#CFEAF4; flex-shrink:0;
    cursor:pointer; background:none; border:none; padding:0;
  }
  .volume-track{
    position:relative; flex:1; height:16px; display:flex; align-items:center;
    cursor:pointer; touch-action:none;
  }
  .volume-track::before{
    content:''; position:absolute; left:0; right:0; top:50%;
    height:4px; margin-top:-2px; border-radius:99px;
    background:rgba(255,255,255,.22);
  }
  .volume-fill{
    position:absolute; left:0; top:50%; height:4px; margin-top:-2px; width:100%;
    background:#CFEAF4; border-radius:99px;
  }
  .volume-thumb{
    position:absolute; top:50%; left:100%; width:12px; height:12px; border-radius:50%;
    background:#fff; transform:translate(-50%, -50%);
    box-shadow:0 1px 3px rgba(0,0,0,.4);
  }

  .drips{ display:flex; align-items:flex-start; width:100%; margin-top:-2px; }
  .drip{
    background:var(--device-deep); flex-shrink:0; transform-origin:top center;
    animation:melting 6s ease-in-out infinite;
  }
  .d1{ width:11%; height:16px; border-radius:0 0 50% 50%; margin-left:6%; animation-delay:-.4s; }
  .d2{ width:9%;  height:38px; border-radius:0 0 50% 50%; margin-left:4%; animation-delay:-2.1s; }
  .d3{ width:14%; height:64px; border-radius:0 0 50% 50%; margin-left:3%; animation-delay:-3.6s; }
  .d4{ width:9%;  height:24px; border-radius:0 0 50% 50%; margin-left:3%; animation-delay:-1.2s; }
  .d5{ width:12%; height:48px; border-radius:0 0 50% 50%; margin-left:4%; animation-delay:-4.8s; }
  .d6{ width:8%;  height:18px; border-radius:0 0 50% 50%; margin-left:3%; animation-delay:-5.5s; }
  @keyframes melting{ 0%,100%{ transform:scaleY(1); } 50%{ transform:scaleY(1.12); } }

  .caption{
    margin:22px 0 0; text-align:center;
    font-family:'Caveat', cursive; font-size:19px; font-weight:600; color:var(--gold);
  }
  .hint{
    margin:6px 0 0; text-align:center; font-size:12px; line-height:1.6;
    letter-spacing:.04em; color:rgba(202,240,248,.75);
  }
  .hint b{ color:var(--ocean-bright); }

  .actions{ display:flex; flex-direction:column; gap:10px; margin-top:22px; }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 20px; border-radius:999px; text-decoration:none;
    font-size:15px; font-weight:700;
    transition:transform .15s ease, filter .15s ease;
  }
  .btn-primary{
    background:linear-gradient(135deg, var(--ocean-bright) 0%, var(--ocean-mid) 100%);
    color:#fff; box-shadow:0 10px 18px -14px rgba(0,0,0,.5);
  }
  .btn-ghost{
    background:rgba(255,255,255,.14); color:var(--ocean-pale);
    border:1px solid rgba(202,240,248,.32);
  }
  .btn:hover{ transform:translateY(-2px); filter:brightness(1.08); }

  .ctrl-btn:focus-visible,
  .vol-icon:focus-visible,
  .upload-btn:focus-within,
  .btn:focus-visible,
  .title:focus-visible{
    outline:3px solid rgba(255,201,143,.9); outline-offset:3px;
  }

  @media (max-width:380px){
    .stage{ max-width:300px; }
    .deco.d1,.deco.d4{ width:48px; }
    .deco.d2,.deco.d3{ width:40px; }
    .deco.d5{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .bubble,.drifter,.spark,.deco,.drip{ animation:none!important; }
    .btn,.ctrl-btn,.upload-btn,.title{ transition:none!important; }
  }
</style>
</head>
<body>
<div class="ocean-rays"></div>
<div class="field" id="field"></div>

<nav class="topnav" aria-label="Navigasi halaman">
  <a href="harapan.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>harapan</span></a>
  <a href="closing.html">lanjut<span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></a>
</nav>

<img class="deco d1" src="./assets/images/5.png" alt="">
<img class="deco d2" src="./assets/images/4.png" alt="">
<img class="deco d3" src="./assets/images/7.png" alt="">
<img class="deco d4" src="./assets/images/9.png" alt="">
<img class="deco d5" src="./assets/images/6.png" alt="">

<main class="stage">
  <div class="device">
    <img class="corner tl" src="./assets/images/1.png" alt="">
    <img class="corner tr" src="./assets/images/8.png" alt="">
    <img class="corner bl" src="./assets/images/4.png" alt="">
    <img class="corner br" src="./assets/images/9.png" alt="">
    <div class="screen" id="screen">
      <video id="video" poster="./assets/videos/momen-kita.jpg" preload="auto"
             playsinline webkit-playsinline disablepictureinpicture
             src="./assets/videos/momen-kita.mp4"></video>

      <div class="buffering" id="buffering"><div class="spinner"></div></div>

      <div class="veil" id="veil">
        <div class="spinner" id="veilSpinner"></div>
        <p class="veil-msg" id="veilMsg">memuat video&hellip;</p>
        <button class="play-fab" id="playFab" hidden aria-label="Putar video">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="retry-btn" id="retryBtn" hidden>coba lagi</button>
      </div>
    </div>

    <p class="title" id="titleText" contenteditable="true" spellcheck="false">momen kita</p>

    <div class="progress-track" id="progressTrack" role="slider" aria-label="Posisi video" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <div class="progress-fill" id="progressFill"></div>
      <div class="progress-thumb" id="progressThumb"></div>
    </div>
    <div class="time-row">
      <span id="currentTimeLabel">0:00</span>
      <span id="remainingTimeLabel">-0:00</span>
    </div>

    <div class="controls-row">
      <button class="ctrl-btn" id="rewindBtn" aria-label="Mundur 10 detik">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6 8.5 6zm10 0V6l-8.5 6 8.5 6z"/></svg>
      </button>
      <button class="ctrl-btn play" id="playPauseBtn" aria-label="Play atau pause">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <button class="ctrl-btn" id="forwardBtn" aria-label="Maju 10 detik">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l8.5-6L13 6zM3 6v12l8.5-6L3 6z"/></svg>
      </button>
    </div>

    <div class="volume-row">
      <button class="vol-icon" id="muteBtn" aria-label="Bisukan atau hidupkan suara" aria-pressed="false">
        <svg id="speakerIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M19 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      </button>
      <div class="volume-track" id="volumeTrack" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" tabindex="0">
        <div class="volume-fill" id="volumeFill"></div>
        <div class="volume-thumb" id="volumeThumb"></div>
      </div>
    </div>

    <button class="upload-btn" id="pickBtn" type="button">pilih video dari hp</button>
    <input type="file" id="fileInput" accept="video/*" hidden>
  </div>

  <div class="drips" aria-hidden="true">
    <div class="drip d1"></div>
    <div class="drip d2"></div>
    <div class="drip d3"></div>
    <div class="drip d4"></div>
    <div class="drip d5"></div>
    <div class="drip d6"></div>
  </div>


  <p class="caption">momen-momen yang aku simpan buat kamu</p>

  <div class="actions">
    <a class="btn btn-primary" href="closing.html">buka kata penutup</a>
    <a class="btn btn-ghost" href="harapan.html">kembali ke doa &amp; harapan</a>
  </div>
</main>

<script>
const CLIP = {
  title: 'momen kita',
  url: './assets/videos/momen-kita.mp4'
};

const video = document.getElementById('video');
const fileInput = document.getElementById('fileInput');
const pickBtn = document.getElementById('pickBtn');
const veil = document.getElementById('veil');
const veilSpinner = document.getElementById('veilSpinner');
const veilMsg = document.getElementById('veilMsg');
const playFab = document.getElementById('playFab');
const retryBtn = document.getElementById('retryBtn');
const buffering = document.getElementById('buffering');
const playPauseBtn = document.getElementById('playPauseBtn');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const rewindBtn = document.getElementById('rewindBtn');
const forwardBtn = document.getElementById('forwardBtn');
const titleText = document.getElementById('titleText');
const progressTrack = document.getElementById('progressTrack');
const progressFill = document.getElementById('progressFill');
const progressThumb = document.getElementById('progressThumb');
const currentTimeLabel = document.getElementById('currentTimeLabel');
const remainingTimeLabel = document.getElementById('remainingTimeLabel');
const volumeTrack = document.getElementById('volumeTrack');
const volumeFill = document.getElementById('volumeFill');
const volumeThumb = document.getElementById('volumeThumb');
const muteBtn = document.getElementById('muteBtn');

let lastVolume = 1;
let usingLocalFile = false;

function formatTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return m + ':' + s;
}

function showVeil(mode, msg){
  if(mode === 'none'){ veil.hidden = true; return; }
  veil.hidden = false;
  veilSpinner.hidden = (mode !== 'loading');
  playFab.hidden = (mode !== 'ready');
  retryBtn.hidden = (mode !== 'error');
  if(msg) veilMsg.textContent = msg;
}

function showBuffering(on){
  buffering.classList.toggle('on', !!on);
}

/* Kegagalan muat tidak lagi me-reset halaman jadi kosong, tapi menampilkan
   pesan + tombol coba lagi, karena itu yang bikin video terasa rusak. */
function handleMediaError(){
  showBuffering(false);
  if(usingLocalFile){
    showVeil('error', 'video dari hp gagal dimuat. coba pilih ulang.');
  } else {
    showVeil('error', 'video belum bisa dimuat. cek koneksi lalu coba lagi.');
  }
}

function loadClip(clip){
  usingLocalFile = false;
  titleText.textContent = clip.title;
  showVeil('loading', 'memuat video\u2026');
  video.src = clip.url;
  video.load();
  const p = video.play();
  if(p && p.catch) p.catch(() => {});
}

retryBtn.addEventListener('click', () => {
  showVeil('loading', 'memuat video\u2026');
  video.load();
  const p = video.play();
  if(p && p.catch) p.catch(() => {});
});

playFab.addEventListener('click', () => {
  const p = video.play();
  if(p && p.catch) p.catch(() => {});
});

pickBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  const file = (fileInput.files || [])[0];
  if(!file) return;
  usingLocalFile = true;
  titleText.textContent = file.name.replace(/\.[^.]+$/, '');
  showVeil('loading', 'memuat video dari hp\u2026');
  video.src = URL.createObjectURL(file);
  video.load();
  const p = video.play();
  if(p && p.catch) p.catch(() => {});
});


function togglePlay(){
  if(video.paused){
    const attempt = video.play();
    if(attempt && attempt.catch) attempt.catch(() => {});
  } else {
    video.pause();
  }
}

playPauseBtn.addEventListener('click', togglePlay);

video.addEventListener('play', () => {
  playIcon.style.display = 'none';
  pauseIcon.style.display = '';
  showVeil('none');
  showBuffering(false);
  document.body.classList.add('is-playing');
});

video.addEventListener('pause', () => {
  playIcon.style.display = '';
  pauseIcon.style.display = 'none';
  document.body.classList.remove('is-playing');
  // Setelah pernah Jalan, tombol putar besar tidak muncul lagi saat dijeda.
  if(video.currentTime > 0 && video.readyState >= 2) showVeil('none');
});

video.addEventListener('waiting', () => showBuffering(true));
video.addEventListener('stalled', () => showBuffering(true));
video.addEventListener('canplay', () => { showBuffering(false); if(video.paused && video.currentTime === 0) showVeil('ready'); });
video.addEventListener('playing', () => showBuffering(false));
video.addEventListener('error', handleMediaError);
video.addEventListener('ended', () => {
  document.body.classList.remove('is-playing');
  showVeil('ready');
  playIcon.style.display = '';
  pauseIcon.style.display = 'none';
});

rewindBtn.addEventListener('click', () => { video.currentTime = Math.max(0, video.currentTime - 10); });
forwardBtn.addEventListener('click', () => {
  if(video.duration) video.currentTime = Math.min(video.duration, video.currentTime + 10);
});

video.addEventListener('timeupdate', () => {
  if(!video.duration) return;
  const pct = (video.currentTime / video.duration) * 100;
  progressFill.style.width = pct + '%';
  progressThumb.style.left = pct + '%';
  currentTimeLabel.textContent = formatTime(video.currentTime);
  remainingTimeLabel.textContent = '-' + formatTime(video.duration - video.currentTime);
  progressTrack.setAttribute('aria-valuenow', Math.round(pct));
});

video.addEventListener('loadedmetadata', () => {
  if(!video.duration) return;
  remainingTimeLabel.textContent = '-' + formatTime(video.duration);
  if(!usingLocalFile) titleText.textContent = CLIP.title;
});

function bindSeek(track, apply){
  function ratioFrom(clientX){
    const rect = track.getBoundingClientRect();
    return Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  }
  let dragging = false;
  track.addEventListener('mousedown', (e) => { dragging = true; apply(ratioFrom(e.clientX)); });
  track.addEventListener('touchstart', (e) => { dragging = true; apply(ratioFrom(e.touches[0].clientX)); }, { passive: true });
  track.addEventListener('touchmove', (e) => { if(dragging) apply(ratioFrom(e.touches[0].clientX)); }, { passive: true });
  track.addEventListener('keydown', (e) => {
    if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const step = e.key === 'ArrowRight' ? .05 : -.05;
    apply(Math.min(1, Math.max(0, (video.currentTime / (video.duration || 1)) + step)));
  });
  window.addEventListener('mousemove', (e) => { if(dragging) apply(ratioFrom(e.clientX)); });
  window.addEventListener('mouseup', () => { dragging = false; });
  window.addEventListener('touchend', () => { dragging = false; });
}

bindSeek(progressTrack, (ratio) => { if(video.duration) video.currentTime = ratio * video.duration; });
bindSeek(volumeTrack, (ratio) => {
  video.volume = ratio;
  if(ratio > 0) lastVolume = ratio;
  volumeFill.style.width = (ratio * 100) + '%';
  volumeThumb.style.left = (ratio * 100) + '%';
  volumeTrack.setAttribute('aria-valuenow', Math.round(ratio * 100));
  muteBtn.setAttribute('aria-pressed', ratio === 0 ? 'true' : 'false');
  video.muted = ratio === 0;
});

video.volume = 1;
video.muted = false;
volumeFill.style.width = '100%';
volumeThumb.style.left = '100%';

muteBtn.addEventListener('click', () => {
  if(video.muted || video.volume === 0){
    video.muted = false;
    video.volume = lastVolume || 1;
  } else {
    lastVolume = video.volume;
    video.muted = true;
    video.volume = 0;
  }
  const shown = video.muted ? 0 : video.volume;
  volumeFill.style.width = (shown * 100) + '%';
  volumeThumb.style.left = (shown * 100) + '%';
  volumeTrack.setAttribute('aria-valuenow', Math.round(shown * 100));
  muteBtn.setAttribute('aria-pressed', video.muted ? 'true' : 'false');
});

// Ketuk area video untuk play/pause, tapi jangan saat menekan kontrol.
document.getElementById('screen').addEventListener('click', (e) => {
  if(e.target.closest('.veil') || e.target.closest('.buffering')) return;
  togglePlay();
});

const field = document.getElementById('field');
const faunaImgs = ['./assets/images/3.png', './assets/images/5.png', './assets/images/6.png'];
function rand(min, max){ return Math.random() * (max - min) + min; }

// Jumlah dekorasi sengaja dikecilkan (dari 38 -> 17): ini sumber utama
// lag di HP karena semuanya fixed + beranimasi menumpuk di atas video.
for(let i = 0; i < 7; i++){
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = rand(6, 18);
  b.style.width = size + 'px';
  b.style.height = size + 'px';
  b.style.left = rand(0, 100) + '%';
  b.style.animationDuration = rand(9, 18) + 's';
  b.style.animationDelay = rand(0, 12) + 's';
  field.appendChild(b);
}

for(let i = 0; i < 2; i++){
  const d = document.createElement('img');
  d.className = 'drifter';
  d.src = faunaImgs[i % faunaImgs.length];
  d.alt = '';
  d.style.top = rand(14, 74) + '%';
  d.style.width = rand(34, 58) + 'px';
  d.style.animationDuration = rand(24, 40) + 's';
  d.style.animationDelay = rand(0, 14) + 's';
  field.appendChild(d);
}

for(let i = 0; i < 8; i++){
  const s = document.createElement('div');
  s.className = 'spark';
  s.style.left = rand(0, 100) + 'vw';
  s.style.top = rand(0, 100) + 'vh';
  s.style.animationDuration = rand(2, 5) + 's';
  s.style.animationDelay = rand(0, 4) + 's';
  field.appendChild(s);
}

// Gate video detached (dulu: membuat elemen video sementara yang tidak
// menempel di DOM) sudah dihapus. iOS Safari tidak memuat media
// element yang tidak terpasang, jadi loadClip() tidak pernah terpanggil
// dan video tidak bisa diputar. Sekarang src-nya langsung ada di markup,
// kita hanya menunggu event-nya.
titleText.textContent = CLIP.title;
showVeil('loading', 'memuat video\u2026');
if(video.readyState >= 1){
  showVeil('ready');
  remainingTimeLabel.textContent = '-' + formatTime(video.duration);
}
video.load();
</script>
