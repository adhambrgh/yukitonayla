<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yeayy Terimakasih Sudah Menjawab!</title>
<!-- Font dimuat lewat <link> + preconnect, bukan @import di dalam CSS.
     @import membuat browser menunggu berkas CSS selesai diunduh dulu
     baru meminta font, sehingga font menjadi permintaan berurutan dan
     render halaman tertahan. Dengan <link>, font diambil paralel
     bersama aset lain sehingga halaman bisa tampil lebih dulu. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap">
<style>

  :root{
    --ocean-deep:#00416B;
    --ocean-mid:#0077B6;
    --ocean-light:#0096C7;
    --ocean-bright:#48CAE4;
    --ocean-pale:#CAF0F8;
    --coral:#FF6B6B;
    --seafoam:#2A9D8F;
    --ink:#002D4A;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    font-family:'Quicksand', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
    background: url('./assets/images/2.jpg') center / cover no-repeat, linear-gradient(180deg, rgba(0,65,107,.45) 0%, rgba(0,105,148,.45) 50%, rgba(72,202,228,.5) 100%);
    overflow-x:hidden; overflow-y:auto;
    position:relative;
  }

  .ocean-rays{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 0%, rgba(202,240,248,.35) 0%, rgba(72,202,228,.1) 45%, transparent 70%);
  }
  .ocean-bg-layer{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }

  .bubble{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.6) 0%, rgba(202,240,248,.25) 45%, rgba(72,202,228,.1) 75%, transparent 100%);
    border:1px solid rgba(255,255,255,.35);
    box-shadow: 0 0 10px rgba(255,255,255,.3) inset, 0 3px 10px rgba(0,35,75,.18);
    animation:floatUp linear infinite;
    pointer-events:none;
  }
  @keyframes floatUp{
    0%{ transform:translateY(105vh) translateX(0) scale(0.3); opacity:0; }
    15%{ opacity:.8; }
    50%{ transform:translateY(50vh) translateX(12px) scale(0.9); }
    85%{ opacity:.8; }
    100%{ transform:translateY(-15vh) translateX(-10px) scale(1.1); opacity:0; }
  }

.fauna-fish{ position:absolute; pointer-events:none; z-index:1; animation:swimAcross linear infinite; filter:drop-shadow(0 4px 10px rgba(0,30,70,.22)); }
  @keyframes swimAcross{
    0%{ transform:translateX(-140px) translateY(0); }
    49.9%{ transform:translateX(calc(100vw + 140px)) translateY(-25px); }
    50%{ transform:translateX(calc(100vw + 140px)) translateY(-25px) scaleX(-1); }
    99.9%{ transform:translateX(-140px) translateY(10px) scaleX(-1); }
    100%{ transform:translateX(-140px) translateY(0); }
  }

  .jelly{ position:absolute; pointer-events:none; z-index:1; opacity:.75; animation:jellyRise linear infinite; }
  @keyframes jellyRise{
    0%{ transform:translateY(110vh) scale(0.85); opacity:0; }
    20%{ opacity:.85; }
    50%{ transform:translateY(50vh) scale(1.05); }
    80%{ opacity:.85; }
    100%{ transform:translateY(-20vh) scale(0.95); opacity:0; }
  }
  .jelly img{ animation:jellyPulse 2.5s ease-in-out infinite; }
  @keyframes jellyPulse{ 0%,100%{ transform:scaleY(1); } 50%{ transform:scaleY(0.8) scaleX(1.1); } }

  .ocean-animals{ position:absolute; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:18px; opacity:.55; z-index:5; pointer-events:none; animation:floatHoriz 20s ease-in-out infinite; }
  @keyframes floatHoriz{ 0%,100%{ transform:translateX(-50%) translateY(0); } 50%{ transform:translateX(-50%) translateY(-8px); } }
  .ocean-animals img{ width:28px; height:28px; }

  .deco-img{
    position:fixed; z-index:2; pointer-events:none;
    filter:drop-shadow(0 8px 16px rgba(0,40,90,.28));
  }
  .deco-img.img1{ width:85px; top:7%; left:4%; animation:decoFloat1 8s ease-in-out infinite; opacity:.8; }
  .deco-img.img2{ width:95px; top:9%; right:4%; animation:decoFloat2 9.5s ease-in-out infinite; opacity:.8; }
  .deco-img.img4{ width:75px; bottom:13%; right:5%; animation:decoFloat1 8.5s ease-in-out infinite reverse; animation-delay:-3s; opacity:.85; }
  .deco-img.img5{ width:75px; top:48%; left:2%; animation:decoFloat1 11s ease-in-out infinite; opacity:.7; }
  .deco-img.img6{ width:80px; top:32%; right:2%; animation:decoFloat2 10s ease-in-out infinite; opacity:.7; }
  .deco-img.img7{ width:52px; top:24%; left:4%; animation:decoSpin 18s linear infinite; opacity:.65; }
  .deco-img.img8{ width:65px; bottom:7%; left:4%; animation:decoFloat2 10.5s ease-in-out infinite reverse; opacity:.75; }
  @keyframes decoFloat1{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-18px) rotate(5deg); } }
  @keyframes decoFloat2{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-20px) rotate(-5deg); } }
  @keyframes decoSpin{ 0%{ transform:rotate(0deg); } 100%{ transform:rotate(360deg); } }

  /* ===== Thank you card ===== */
  .thank-card{
    position:relative; z-index:10; width:100%; max-width:420px;
    background:#fffdf8;
    border:1px solid rgba(255,255,255,.92);
    border-radius:32px; padding:38px 30px 30px;
    box-shadow:0 28px 56px -24px rgba(0,35,75,.5), 0 0 0 1px rgba(72,202,228,.08) inset;
    text-align:center;
  }

  .thank-card .card-peeker{
    position:absolute; top:-38px; right:-20px; width:76px; height:76px;
    pointer-events:none; z-index:15;
    filter:drop-shadow(0 10px 16px rgba(0,40,90,.3));
    animation:peekBob 4s ease-in-out infinite;
  }
  .thank-card .card-peeker img{ width:100%; height:100%; object-fit:contain; }
  @keyframes peekBob{ 0%,100%{ transform:translateY(0) rotate(8deg); } 50%{ transform:translateY(-8px) rotate(14deg); } }

  .thank-card .card-corner-dec{
    position:absolute; bottom:-28px; left:-22px; width:70px; height:70px;
    pointer-events:none; z-index:15;
    filter:drop-shadow(0 8px 14px rgba(0,40,90,.3));
    animation:cornerBob 4.5s ease-in-out infinite;
  }
  .thank-card .card-corner-dec img{ width:100%; height:100%; object-fit:contain; }
  @keyframes cornerBob{ 0%,100%{ transform:translateY(0) rotate(-10deg); } 50%{ transform:translateY(-6px) rotate(-16deg); } }

  .mascot{
    width:120px; height:120px; object-fit:contain; margin:0 auto 14px;
    display:block; filter:drop-shadow(0 10px 18px rgba(0,70,120,.25));
    animation:bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(0); } 50%{ transform:translateY(-8px) rotate(-2deg); } }

  .scene{
    position:relative; width:180px; height:170px; margin:0 auto 6px;
  }
  .scene::before{
    content:''; position:absolute; inset:4px;
    background:radial-gradient(circle at 50% 42%, rgba(72,202,228,.2), rgba(255,255,255,0) 68%);
  }
  .scene .couple{
    position:relative; z-index:1;
    width:180px; height:170px;
  }

  h1{
    margin:14px 0 10px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:30px; line-height:1.35;
    color:var(--ocean-deep);
  }

  .subtitle{
    margin:0 0 26px; font-size:20px; font-weight:600;
    color:var(--ink); opacity:.85; max-width:320px; line-height:1.5;
  }
  .anniversary-line{
    display:inline-block; margin-top:8px;
    color:var(--coral); font-size:15px; font-weight:800; letter-spacing:.03em;
  }

  .tap-btn{
    padding:15px 34px; border:none; border-radius:999px;
    background:linear-gradient(135deg, var(--ocean-bright) 0%, var(--ocean-light) 100%);
    color:#fff; font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:15px; cursor:pointer;
    box-shadow:0 10px 18px -14px rgba(0,45,74,.55);
    animation:pulse 1.8s ease-in-out infinite;
    transition:transform .15s;
  }
  .tap-btn:hover{ filter:brightness(1.08); }
  .tap-btn:active{ transform:scale(.95); }
  .tap-btn:focus-visible{ outline:3px solid rgba(255,107,107,.65); outline-offset:3px; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.05); } }

  .sign-off{
    margin-top:18px; font-size:15px; font-weight:700;
    color:var(--ocean-mid); opacity:.7;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .sign-off svg{ width:16px; height:16px; }

  @media (prefers-reduced-motion: reduce){
    .mascot,.tap-btn,.bubble,.fauna-fish,.jelly,.ocean-animals,.deco-img,.thank-card .card-peeker,.thank-card .card-corner-dec{ animation:none!important; }
  }
  @media (max-width:420px){
    .thank-card{ padding:28px 20px 24px; }
    h1{ font-size:20px; }
    .thank-card .card-peeker{ width:60px; height:60px; top:-30px; right:-15px; }
    .thank-card .card-corner-dec{ width:55px; height:55px; bottom:-22px; left:-18px; }
  }
</style>
</head>
<body>

<div class="ocean-rays"></div>
<div class="ocean-bg-layer" id="oceanBg"></div>

<div class="ocean-animals" id="oceanAnimals"></div>

<img class="deco-img img1" src="./assets/images/5.png" alt="" />
<img class="deco-img img2" src="./assets/images/4.png" alt="" />
<img class="deco-img img4" src="./assets/images/6.png" alt="" />
<img class="deco-img img5" src="./assets/images/9.png" alt="" />
<img class="deco-img img6" src="./assets/images/8.png" alt="" />
<img class="deco-img img7" src="./assets/images/7.png" alt="" />
<img class="deco-img img8" src="./assets/images/3.png" alt="" />

<div class="thank-card">
  <div class="card-peeker"><img src="./assets/images/5.png" alt="" /></div>
  <div class="card-corner-dec"><img src="./assets/images/4.png" alt="" /></div>

  <img class="mascot" src="./assets/images/1.png" alt="mascot" />

  <div class="scene">
    <svg class="couple" viewBox="0 0 180 170" fill="none" role="img" aria-label="Ilustrasi pasangan di bawah laut">
      <path d="M14 143 C40 132 58 148 88 140 C118 132 138 150 166 138" stroke="#2A9D8F" stroke-width="2" stroke-linecap="round"/>
      <path d="M30 146 C25 133 33 124 31 114 M150 146 C156 132 148 124 150 112" stroke="#2A9D8F" stroke-width="2" stroke-linecap="round"/>
      <path d="M40 62 C40 40 50 28 64 28 C78 28 88 40 88 62 L84 70 H44 Z" fill="#00416B"/>
      <circle cx="64" cy="58" r="20" fill="#FFE3D3"/>
      <path d="M42 55 C38 42 44 30 56 25 C66 20 78 24 86 34 L92 30 L88 48 C78 42 66 41 56 44 C50 46 46 50 42 55 Z" fill="#00416B"/>
      <path d="M52 34 C60 30 70 30 78 34" stroke="#48CAE4" stroke-width="2" stroke-linecap="round"/>
      <circle cx="58" cy="60" r="2" fill="#00416B"/>
      <circle cx="70" cy="60" r="2" fill="#00416B"/>
      <path d="M60 68 Q64 72 68 68" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"/>
      <path d="M45 90 C40 100 38 114 40 128 H88 C90 114 88 100 83 90 C77 95 71 97 64 97 C57 97 51 95 45 90 Z" fill="#CAF0F8" stroke="#0077B6" stroke-width="2" stroke-linejoin="round"/>
      <path d="M56 92 L64 101 L72 92" stroke="#0077B6" stroke-width="2" stroke-linejoin="round"/>
      <path d="M47 97 C57 101 71 101 81 97" stroke="#48CAE4" stroke-width="2" stroke-linecap="round"/>
      <path d="M90 66 C88 42 100 28 116 28 C132 28 144 42 142 66 L138 84 H94 Z" fill="#FF8FAB"/>
      <circle cx="116" cy="58" r="20" fill="#FFD7C2"/>
      <path d="M96 55 C100 35 130 31 136 53 C124 47 108 47 96 55 Z" fill="#FF8FAB"/>
      <circle cx="110" cy="60" r="2" fill="#00416B"/>
      <circle cx="122" cy="60" r="2" fill="#00416B"/>
      <path d="M112 68 Q116 72 120 68" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"/>
      <path d="M97 90 C92 100 90 114 92 128 H140 C142 114 140 100 135 90 C129 95 123 97 116 97 C109 97 103 95 97 90 Z" fill="#FFB6C1" stroke="#FF6B6B" stroke-width="2" stroke-linejoin="round"/>
      <path d="M99 97 C109 101 123 101 133 97" stroke="#FF8FAB" stroke-width="2" stroke-linecap="round"/>
      <path d="M90 116 C80 108 74 100 79 95 C83 91 88 94 90 97 C92 94 97 91 101 95 C106 100 100 108 90 116 Z" fill="#FF6B6B"/>
      <circle cx="22" cy="34" r="5" fill="#CAF0F8" stroke="#48CAE4" stroke-width="1.5"/>
      <circle cx="158" cy="46" r="4" fill="#CAF0F8" stroke="#48CAE4" stroke-width="1.5"/>
      <circle cx="150" cy="26" r="2.5" fill="#48CAE4"/>
    </svg>
  </div>

  <h1>yeayy terimakasih<br>sudah menjawab!</h1>
  <p class="subtitle">last one aku bikin sesuatu<br>untuk u sayang, siap yaaa ..<br><span class="anniversary-line">happy anniversary, sayang</span></p>

  <button class="tap-btn" id="tapBtn" type="button">oteiii sayanggg</button>

  <div class="sign-off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.6-10-9C.2 8.8 1.6 5 5.3 5c2 0 3.4 1 4.7 2.7C11.3 6 12.7 5 14.7 5 18.4 5 19.8 8.8 22 12c-2.5 4.4-10 9-10 9z"/></svg>
    <span>dari aku, buat kamu selamanya</span>
  </div>
</div>

<script>
const oceanBg = document.getElementById('oceanBg');
const oceanAnimals = document.getElementById('oceanAnimals');

const faunaImgs = ['./assets/images/4.png','./assets/images/5.png','./assets/images/3.png','./assets/images/6.png'];

/* ===== Bubbles ===== */
for(let i = 0; i < 28; i++){
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = Math.random() * 18 + 6;
  b.style.width = size + 'px'; b.style.height = size + 'px';
  b.style.left = Math.random() * 100 + '%';
  b.style.animationDuration = (Math.random() * 10 + 8) + 's';
  b.style.animationDelay = (Math.random() * 12) + 's';
  oceanBg.appendChild(b);
}

/* ===== Swimming Fish ===== */
for(let i = 0; i < 7; i++){
  const f = document.createElement('img');
  f.className = 'fauna-fish';
  f.src = faunaImgs[i % faunaImgs.length];
  f.alt = '';
  f.style.top = (Math.random() * 65 + 8) + '%';
  f.style.animationDuration = (Math.random() * 18 + 14) + 's';
  f.style.animationDelay = (Math.random() * 12) + 's';
  const w = Math.random() * 40 + 50;
  f.style.width = w + 'px';
  oceanBg.appendChild(f);
}

/* ===== Jellyfish ===== */
for(let i = 0; i < 5; i++){
  const j = document.createElement('img');
  j.className = 'jelly';
  j.src = faunaImgs[(i + 2) % faunaImgs.length];
  j.alt = '';
  j.style.left = (Math.random() * 90 + 5) + '%';
  j.style.animationDuration = (Math.random() * 14 + 18) + 's';
  j.style.animationDelay = (Math.random() * 10) + 's';
  const w = Math.random() * 30 + 50;
  j.style.width = w + 'px';
  oceanBg.appendChild(j);
}

/* ===== Top ocean animals ===== */
const oceanDeco = [
  '<svg viewBox="0 0 40 40"><circle cx="20" cy="22" r="14" fill="#B8E4F7" stroke="#0077B6" stroke-width="1.5"/><circle cx="13" cy="19" r="4" fill="#0077B6"/><circle cx="27" cy="19" r="4" fill="#0077B6"/><circle cx="11" cy="17" r="1.5" fill="#fff"/><circle cx="25" cy="17" r="1.5" fill="#fff"/><path d="M16 26 Q20 30 24 26" stroke="#0077B6" stroke-width="1.5" fill="none"/></svg>',
  '<svg viewBox="0 0 40 40"><ellipse cx="20" cy="22" rx="16" ry="12" fill="#FFB6C1" opacity=".8"/><path d="M36 22 L44 12 L44 32 Z" fill="#FFB6C1" opacity=".8"/><circle cx="12" cy="18" r="3" fill="#E87A8A"/><circle cx="28" cy="18" r="3" fill="#E87A8A"/></svg>',
  '<svg viewBox="0 0 40 40"><ellipse cx="20" cy="18" rx="14" ry="10" fill="#B8E4F7" stroke="#0077B6" stroke-width="1"/><path d="M6 18 L2 10 L2 26 Z" fill="#B8E4F7" stroke="#0077B6" stroke-width="1"/><circle cx="13" cy="16" r="2.5" fill="#0077B6"/><circle cx="27" cy="16" r="2.5" fill="#0077B6"/></svg>',
  '<svg viewBox="0 0 40 40"><path d="M8 35 Q20 15 32 35 Z" fill="#2A9D8F" opacity=".7"/><circle cx="16" cy="33" r="2" fill="#1A6B5F"/><circle cx="24" cy="33" r="2" fill="#1A6B5F"/></svg>'
];
oceanDeco.forEach((svg, i) => {
  const span = document.createElement('span');
  span.innerHTML = svg;
  span.style.animationDelay = (i * 0.5) + 's';
  span.style.opacity = (Math.random() * 0.3 + 0.4) + '';
  oceanAnimals.appendChild(span);
});

/* ===== Tap button ===== */
document.getElementById('tapBtn').addEventListener('click', () => {
  window.location.href = 'anniversary.html';
});
</script>

</body>
</html>
