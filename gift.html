<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Udah Siap Belom Sama Kadonya?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap');

  :root{
    --ocean-deep:#00416B;
    --ocean-mid:#0077B6;
    --ocean-light:#0096C7;
    --ocean-bright:#48CAE4;
    --ocean-pale:#CAF0F8;
    --coral:#FF6B6B;
    --seafoam:#2A9D8F;
    --ink:#002D4A;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    font-family:'Quicksand', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
    background: url('./assets/images/2.jpg') center / cover no-repeat, linear-gradient(180deg, rgba(0,65,107,.45) 0%, rgba(0,105,148,.45) 50%, rgba(72,202,228,.5) 100%);
    overflow:hidden;
    position:relative;
  }

  .ocean-bg-layer{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }

  .ocean-rays{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 0%, rgba(202,240,248,.35) 0%, rgba(72,202,228,.1) 45%, transparent 70%);
  }

  .bubble{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.6) 0%, rgba(202,240,248,.25) 45%, rgba(72,202,228,.1) 75%, transparent 100%);
    border:1px solid rgba(255,255,255,.35);
    box-shadow: 0 0 10px rgba(255,255,255,.3) inset, 0 3px 10px rgba(0,35,75,.18);
    animation:floatUp linear infinite;
    pointer-events:none;
  }
  @keyframes floatUp{
    0%{ transform:translateY(105vh) translateX(0) scale(0.3); opacity:0; }
    15%{ opacity:.8; }
    50%{ transform:translateY(50vh) translateX(12px) scale(0.9); }
    85%{ opacity:.8; }
    100%{ transform:translateY(-15vh) translateX(-10px) scale(1.1); opacity:0; }
  }

  .fauna-fish{ position:absolute; pointer-events:none; z-index:1; animation:swimAcross linear infinite; filter:drop-shadow(0 4px 10px rgba(0,30,70,.22)); }
  @keyframes swimAcross{
    0%{ transform:translateX(-140px) translateY(0); }
    49.9%{ transform:translateX(calc(100vw + 140px)) translateY(-25px); }
    50%{ transform:translateX(calc(100vw + 140px)) translateY(-25px) scaleX(-1); }
    99.9%{ transform:translateX(-140px) translateY(10px) scaleX(-1); }
    100%{ transform:translateX(-140px) translateY(0); }
  }

  .jelly{ position:absolute; pointer-events:none; z-index:1; opacity:.75; animation:jellyRise linear infinite; }
  @keyframes jellyRise{
    0%{ transform:translateY(110vh) scale(0.85); opacity:0; }
    20%{ opacity:.85; }
    50%{ transform:translateY(50vh) scale(1.05); }
    80%{ opacity:.85; }
    100%{ transform:translateY(-20vh) scale(0.95); opacity:0; }
  }
  .jelly img{ animation:jellyPulse 2.5s ease-in-out infinite; }
  @keyframes jellyPulse{ 0%,100%{ transform:scaleY(1); } 50%{ transform:scaleY(0.8) scaleX(1.1); } }

  .ocean-animals{ position:absolute; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:18px; opacity:.55; z-index:5; pointer-events:none; animation:floatHoriz 20s ease-in-out infinite; }
  @keyframes floatHoriz{ 0%,100%{ transform:translateX(-50%) translateY(0); } 50%{ transform:translateX(-50%) translateY(-8px); } }
  .ocean-animals img{ width:28px; height:28px; }

  .deco-img{
    position:fixed; z-index:2; pointer-events:none;
    filter:drop-shadow(0 8px 16px rgba(0,40,90,.28));
  }
  .deco-img.img1{ width:85px; top:7%; left:4%; animation:decoFloat1 8s ease-in-out infinite; opacity:.8; }
  .deco-img.img2{ width:95px; top:9%; right:4%; animation:decoFloat2 9.5s ease-in-out infinite; opacity:.8; }
  .deco-img.img4{ width:75px; bottom:13%; right:5%; animation:decoFloat1 8.5s ease-in-out infinite reverse; animation-delay:-3s; opacity:.85; }
  .deco-img.img5{ width:75px; top:48%; left:2%; animation:decoFloat1 11s ease-in-out infinite; opacity:.7; }
  .deco-img.img6{ width:80px; top:32%; right:2%; animation:decoFloat2 10s ease-in-out infinite; opacity:.7; }
  .deco-img.img7{ width:52px; top:24%; left:4%; animation:decoSpin 18s linear infinite; opacity:.65; }
  .deco-img.img8{ width:65px; bottom:7%; left:4%; animation:decoFloat2 10.5s ease-in-out infinite reverse; opacity:.75; }
  @keyframes decoFloat1{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-18px) rotate(5deg); } }
  @keyframes decoFloat2{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-20px) rotate(-5deg); } }
  @keyframes decoSpin{ 0%{ transform:rotate(0deg); } 100%{ transform:rotate(360deg); } }

  /* ===== Gift card ===== */
  .gift-card{
    position:relative; z-index:10; width:100%; max-width:420px;
    background:#fffdf8;
    border:1px solid rgba(255,255,255,.92);
    border-radius:32px; padding:38px 30px 30px;
    box-shadow:0 28px 56px -24px rgba(0,35,75,.5), 0 0 0 1px rgba(72,202,228,.08) inset;
    text-align:center;
  }

  .gift-card .card-peeker{
    position:absolute; top:-38px; right:-20px; width:76px; height:76px;
    pointer-events:none; z-index:15;
    filter:drop-shadow(0 10px 16px rgba(0,40,90,.3));
    animation:peekBob 4s ease-in-out infinite;
  }
  .gift-card .card-peeker img{ width:100%; height:100%; object-fit:contain; }
  @keyframes peekBob{ 0%,100%{ transform:translateY(0) rotate(8deg); } 50%{ transform:translateY(-8px) rotate(14deg); } }

  .gift-card .card-corner-dec{
    position:absolute; bottom:-28px; left:-22px; width:70px; height:70px;
    pointer-events:none; z-index:15;
    filter:drop-shadow(0 8px 14px rgba(0,40,90,.3));
    animation:cornerBob 4.5s ease-in-out infinite;
  }
  .gift-card .card-corner-dec img{ width:100%; height:100%; object-fit:contain; }
  @keyframes cornerBob{ 0%,100%{ transform:translateY(0) rotate(-10deg); } 50%{ transform:translateY(-6px) rotate(-16deg); } }

  .box{
    width:150px; height:150px; margin:0 auto;
    filter:drop-shadow(0 16px 28px rgba(0,50,95,.35));
    animation:wiggle 2.4s ease-in-out infinite;
  }
  @keyframes wiggle{
    0%,100%{ transform:rotate(0deg); }
    25%{ transform:rotate(-3deg); }
    75%{ transform:rotate(3deg); }
  }

  h1{
    margin:18px 0 26px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:30px; line-height:1.35;
    color:var(--ocean-deep);
  }

  .choices{
    position:relative;
    display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
    align-items:center; gap:14px; width:100%; min-height:128px;
  }

  .yes-slot{
    display:flex; align-items:center; justify-content:center; min-width:0;
  }

  .no-zone{
    position:relative; height:128px; min-width:0;
    overflow:hidden; border-radius:18px;
  }

  .btn{
    padding:15px 26px; border-radius:999px;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:15px;
    cursor:pointer; white-space:nowrap;
    transition:transform .15s ease, box-shadow .15s ease;
  }

  .btn-yes{
    border:none;
    background:linear-gradient(135deg, var(--ocean-bright) 0%, var(--ocean-light) 100%);
    color:#fff;
    box-shadow:0 10px 18px -14px rgba(0,45,74,.55);
    animation:pulse 1.8s ease-in-out infinite;
  }
  .btn-yes:hover{ filter:brightness(1.08); }
  .btn-yes:active{ transform:scale(.95); }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.05); } }

  .btn-no{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    padding:13px 16px; font-size:15px;
    border:2px solid var(--ocean-bright);
    background:#fffafd; color:var(--coral);
    transition:left .18s ease, top .18s ease, transform .18s ease;
  }
  .btn-no:hover{ background:#fff0f4; }
  .btn-no:active{ transform:scale(.96); }

  .btn:focus-visible{
    outline:3px solid rgba(255,107,107,.65); outline-offset:3px;
  }

  .teasing{
    min-height:22px; margin:16px 0 0; font-size:20px; font-weight:600;
    color:var(--ink); opacity:0;
    transition:opacity .3s ease;
  }
  .teasing.show{ opacity:.75; }

  @media (prefers-reduced-motion: reduce){
    .box,.btn-yes,.btn-no,.bubble,.fauna-fish,.jelly,.ocean-animals,.deco-img,.gift-card .card-peeker,.gift-card .card-corner-dec{ animation:none!important; }
    .btn-no,.btn{ transition:none!important; }
  }
  @media (max-width:420px){
    .gift-card{ padding:28px 20px 24px; }
    h1{ font-size:20px; }
    .gift-card .card-peeker{ width:60px; height:60px; top:-30px; right:-15px; }
    .gift-card .card-corner-dec{ width:55px; height:55px; bottom:-22px; left:-18px; }
    .choices{ grid-template-columns:1fr 1fr; gap:8px; }
    .no-zone{ height:120px; }
    .btn-no{ padding:12px 8px; font-size:15px; }
  }
</style>
</head>
<body>

<div class="ocean-rays"></div>
<div class="ocean-bg-layer" id="oceanBg"></div>

<div class="ocean-animals" id="oceanAnimals"></div>

<img class="deco-img img1" src="./assets/images/5.png" alt="" />
<img class="deco-img img2" src="./assets/images/4.png" alt="" />
<img class="deco-img img4" src="./assets/images/6.png" alt="" />
<img class="deco-img img5" src="./assets/images/9.png" alt="" />
<img class="deco-img img6" src="./assets/images/8.png" alt="" />
<img class="deco-img img7" src="./assets/images/7.png" alt="" />
<img class="deco-img img8" src="./assets/images/3.png" alt="" />

<div class="gift-card">
  <div class="card-peeker"><img src="./assets/images/5.png" alt="" /></div>
  <div class="card-corner-dec"><img src="./assets/images/4.png" alt="" /></div>

  <svg class="box" viewBox="0 0 160 160" fill="none">
    <path d="M18 52 L142 52 L152 78 L8 78 Z" fill="#A8E8DD" stroke="#2A9D8F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M52 52 C52 42 58 36 64 36" stroke="#2A9D8F" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="M108 52 C108 42 102 36 96 36" stroke="#2A9D8F" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="M18 78 L142 78 L136 138 C136 144 130 148 124 148 L36 148 C30 148 24 144 24 138 Z" fill="#7FD4C3" stroke="#2A9D8F" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="80" cy="96" r="26" fill="#E0F9F3" opacity=".95"/>
    <path d="M80 76 L86 92 L102 92 L89 101 L94 117 L80 107 L66 117 L71 101 L58 92 L74 92 Z" fill="#FF8FAB" opacity=".8"/>
    <path d="M28 92 C28 88 32 85 36 85 C42 85 44 90 44 94 C44 99 40 103 36 107 C32 103 28 99 28 92 Z" fill="rgba(72,202,228,.5)"/>
  </svg>

  <h1>aloo sayang, udah siap<br>belom sama kadonya?</h1>

  <div class="choices" id="choices">
    <div class="yes-slot">
      <button class="btn btn-yes" id="yesBtn" type="button">soOo excited!<svg style="width:18px;height:18px;vertical-align:-3px;margin-left:4px" viewBox="0 0 24 24" fill="#FFD700"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></button>
    </div>
    <div class="no-zone" id="noZone">
      <button class="btn btn-no" id="noBtn" type="button">no no by, no no</button>
    </div>
  </div>

  <p class="teasing" id="teasing" aria-live="polite">ish, iseng mulu <svg style="width:14px;height:14px;vertical-align:-2px" viewBox="0 0 24 24" fill="#FF8FAB"><circle cx="12" cy="12" r="10"/><ellipse cx="9" cy="10" rx="2" ry="3" fill="#fff"/><ellipse cx="15" cy="10" rx="2" ry="3" fill="#fff"/><path d="M9 16c0-2 1.5-3 3-3s3 1 3 3" fill="#fff"/></svg> tap yang excited sekarang juga!</p>
</div>

<script>
const oceanBg = document.getElementById('oceanBg');
const oceanAnimals = document.getElementById('oceanAnimals');

/* ===== Bubbles ===== */
for(let i = 0; i < 28; i++){
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = Math.random() * 18 + 6;
  b.style.width = size + 'px'; b.style.height = size + 'px';
  b.style.left = Math.random() * 100 + '%';
  b.style.animationDuration = (Math.random() * 10 + 8) + 's';
  b.style.animationDelay = (Math.random() * 12) + 's';
  oceanBg.appendChild(b);
}

/* ===== Fauna pakai gambar assets ===== */
const faunaImgs = ['./assets/images/4.png','./assets/images/5.png','./assets/images/3.png','./assets/images/6.png'];

for(let i = 0; i < 8; i++){
  const f = document.createElement('img');
  f.className = 'fauna-fish';
  f.src = faunaImgs[i % faunaImgs.length];
  f.alt = '';
  f.style.top = (Math.random() * 65 + 8) + '%';
  f.style.animationDuration = (Math.random() * 18 + 14) + 's';
  f.style.animationDelay = (Math.random() * 12) + 's';
  const w = Math.random() * 40 + 50;
  f.style.width = w + 'px';
  oceanBg.appendChild(f);
}

for(let i = 0; i < 5; i++){
  const j = document.createElement('img');
  j.className = 'jelly';
  j.src = faunaImgs[(i + 2) % faunaImgs.length];
  j.alt = '';
  j.style.left = (Math.random() * 90 + 5) + '%';
  j.style.animationDuration = (Math.random() * 14 + 18) + 's';
  j.style.animationDelay = (Math.random() * 10) + 's';
  const w = Math.random() * 30 + 50;
  j.style.width = w + 'px';
  oceanBg.appendChild(j);
}

for(let i = 0; i < 4; i++){
  const im = document.createElement('img');
  im.src = faunaImgs[i % faunaImgs.length];
  im.alt = '';
  im.style.width = '28px'; im.style.height = '28px';
  im.style.animationDelay = (i * 0.5) + 's';
  im.style.opacity = (Math.random() * 0.3 + 0.4) + '';
  oceanAnimals.appendChild(im);
}

/* ===== Yes / No ===== */
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const noZone = document.getElementById('noZone');
const teasing = document.getElementById('teasing');

yesBtn.addEventListener('click', () => {
  window.location.href = 'thank-you.html';
});

function dodge(){
  const area = noZone.getBoundingClientRect();
  const btn = noBtn.getBoundingClientRect();
  const pad = 8;
  const maxX = Math.max(pad, area.width - btn.width - pad);
  const maxY = Math.max(pad, area.height - btn.height - pad);
  noBtn.style.left = `${pad + Math.random() * (maxX - pad)}px`;
  noBtn.style.top = `${pad + Math.random() * (maxY - pad)}px`;
  noBtn.style.transform = 'none';
  teasing.classList.add('show');
}

noBtn.addEventListener('mouseenter', dodge);
noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); dodge(); }, { passive:false });
noBtn.addEventListener('click', (e) => { e.preventDefault(); dodge(); });
</script>

</body>
</html>
