<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tebak Passwordnya!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap');

  :root{
    --ocean-deep:#00416B;
    --ocean-mid:#0077B6;
    --ocean-light:#0096C7;
    --ocean-bright:#48CAE4;
    --ocean-pale:#CAF0F8;
    --coral:#FF6B6B;
    --seafoam:#2A9D8F;
    --ink:#002D4A;
    --card:#f8fdff;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    font-family:'Quicksand', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
    background: url('./assets/images/2.png') center / cover no-repeat fixed, linear-gradient(180deg, rgba(0,65,107,.45) 0%, rgba(0,105,148,.45) 50%, rgba(72,202,228,.5) 100%);
    overflow:hidden;
    position:relative;
  }

  .ocean-bg-layer{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }

  /* Ocean light rays & atmosphere */
  .ocean-rays{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 0%, rgba(202,240,248,.35) 0%, rgba(72,202,228,.1) 45%, transparent 70%);
  }

  .bubble{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.6) 0%, rgba(202,240,248,.25) 45%, rgba(72,202,228,.1) 75%, transparent 100%);
    border:1px solid rgba(255,255,255,.35);
    box-shadow: 0 0 10px rgba(255,255,255,.3) inset, 0 0 8px rgba(72,202,228,.3);
    animation:floatUp linear infinite;
    pointer-events:none;
  }
  @keyframes floatUp{
    0%{ transform:translateY(105vh) translateX(0) scale(0.3); opacity:0; }
    15%{ opacity:.8; }
    50%{ transform:translateY(50vh) translateX(12px) scale(0.9); }
    85%{ opacity:.8; }
    100%{ transform:translateY(-15vh) translateX(-10px) scale(1.1); opacity:0; }
  }



  .fauna-fish{ position:absolute; pointer-events:none; z-index:1; animation:swimAcross linear infinite; filter:drop-shadow(0 6px 14px rgba(0,30,70,.3)); border-radius:50%; object-fit:cover; }
  @keyframes swimAcross{
    0%{ transform:translateX(-140px) translateY(0); }
    49.9%{ transform:translateX(calc(100vw + 140px)) translateY(-25px); }
    50%{ transform:translateX(calc(100vw + 140px)) translateY(-25px) scaleX(-1); }
    99.9%{ transform:translateX(-140px) translateY(10px) scaleX(-1); }
    100%{ transform:translateX(-140px) translateY(0); }
  }

  .jelly{ position:absolute; pointer-events:none; z-index:1; opacity:.75; animation:jellyRise linear infinite; }
  @keyframes jellyRise{
    0%{ transform:translateY(110vh) scale(0.85); opacity:0; }
    20%{ opacity:.85; }
    50%{ transform:translateY(50vh) scale(1.05); }
    80%{ opacity:.85; }
    100%{ transform:translateY(-20vh) scale(0.95); opacity:0; }
  }
  .jelly img{ animation:jellyPulse 2.5s ease-in-out infinite; border-radius:50%; object-fit:cover; }
  @keyframes jellyPulse{ 0%,100%{ transform:scaleY(1); } 50%{ transform:scaleY(0.8) scaleX(1.1); } }

  .starfish-dec{ position:fixed; bottom:14px; pointer-events:none; z-index:3; filter:drop-shadow(0 4px 10px rgba(0,30,70,.3)); animation:starGlow 4s ease-in-out infinite; }
  @keyframes starGlow{ 0%,100%{ transform:scale(1) rotate(0deg); opacity:.8; } 50%{ transform:scale(1.08) rotate(6deg); opacity:1; } }

  .card{
    position:relative; z-index:10; width:100%; max-width:400px;
    background:linear-gradient(180deg, rgba(255,255,255,.96) 0%, rgba(240,253,255,.95) 100%);
    border-radius:32px; padding:38px 30px 30px;
    box-shadow: 0 30px 60px -20px rgba(0,35,75,.4), 0 0 0 1px rgba(255,255,255,.8) inset, 0 12px 32px -8px rgba(72,202,228,.25);
    backdrop-filter:blur(12px); text-align:center;
  }

  /* Cute 3.png badge decorating the card */
  .card-peeker{
    position:absolute; top:-38px; right:-20px; width:76px; height:76px;
    pointer-events:none; z-index:15;
    filter:drop-shadow(0 10px 16px rgba(0,40,90,.3));
    animation:peekBob 4s ease-in-out infinite;
  }
  .card-peeker img{ width:100%; height:100%; object-fit:contain; }
  @keyframes peekBob{ 0%,100%{ transform:translateY(0) rotate(8deg); } 50%{ transform:translateY(-8px) rotate(14deg); } }

  .card-corner-dec{
    position:absolute; bottom:-28px; left:-22px; width:70px; height:70px;
    pointer-events:none; z-index:15;
    filter:drop-shadow(0 8px 14px rgba(0,40,90,.3));
    animation:cornerBob 4.5s ease-in-out infinite;
  }
  .card-corner-dec img{ width:100%; height:100%; object-fit:contain; }
  @keyframes cornerBob{ 0%,100%{ transform:translateY(0) rotate(-10deg); } 50%{ transform:translateY(-6px) rotate(-16deg); } }

  h1{ margin:0 0 8px; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:22px; line-height:1.3; color:var(--ocean-deep); }
  .subtitle{ margin:0 0 18px; font-weight:600; font-size:14px; color:var(--ink); opacity:.85; line-height:1.5; }

  .mascot{
    width:115px; height:115px; object-fit:contain; margin:0 auto 14px;
    display:block; filter:drop-shadow(0 10px 18px rgba(0,70,120,.25));
    transition:transform .2s ease;
  }
  .mascot.shake{ animation:shake .45s ease; }
  .mascot.yay{ animation:pop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes shake{
    0%,100%{ transform:rotate(0); } 20%{ transform:rotate(-10deg) scale(0.95); } 40%{ transform:rotate(9deg) scale(0.95); }
    60%{ transform:rotate(-7deg); } 80%{ transform:rotate(5deg); }
  }
  @keyframes pop{ 0%{ transform:scale(1); } 45%{ transform:scale(1.22) rotate(-6deg); } 100%{ transform:scale(1); } }

  .dots{ display:flex; justify-content:center; gap:14px; margin:4px 0 22px; }
  .dot{ position:relative; width:44px; height:44px; display:flex; align-items:center; justify-content:center; }
  .dot img{
    width:44px; height:44px; object-fit:contain; border-radius:50%;
    transition:transform .2s ease, box-shadow .2s ease, filter .2s ease;
    background:linear-gradient(135deg, rgba(255,255,255,.9) 0%, rgba(230,248,255,.9) 100%);
    box-shadow:0 4px 12px rgba(0,80,130,.15), 0 0 0 2px rgba(72,202,228,.2) inset;
    filter:grayscale(1) brightness(1.1);
  }
  .dot.filled img{
    filter:grayscale(0) brightness(1) saturate(1.1);
    animation:dotPop .45s cubic-bezier(.34,1.56,.64,1) forwards;
    box-shadow:0 8px 24px rgba(72,202,228,.4), 0 0 0 3px rgba(72,202,228,.35) inset;
  }
  .dot.filled::after{
    content:''; position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
    width:18px; height:18px; border-radius:50%; background:var(--ocean-bright);
    opacity:0; animation:dotGlow .6s ease-out forwards;
    box-shadow:0 0 16px rgba(72,202,228,.7);
  }
  .dot.wrong img{ filter:grayscale(0) brightness(1) saturate(1.2) hue-rotate(-120deg); }
  @keyframes dotPop{ 0%{ transform:scale(1); } 50%{ transform:scale(1.45) rotate(-4deg); } 100%{ transform:scale(1) rotate(0); } }
  @keyframes dotGlow{ 0%{ opacity:0; transform:translateX(-50%) scale(0.5); } 50%{ opacity:.85; transform:translateX(-50%) scale(1.3); } 100%{ opacity:0; transform:translateX(-50%) scale(2); } }

  .pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .key{
    padding:16px 0; border-radius:16px; border:1.5px solid var(--ocean-bright);
    background:rgba(255,255,255,.9); color:var(--ocean-deep);
    font-family:'Quicksand', sans-serif; font-weight:700; font-size:19px;
    cursor:pointer; transition:transform .12s, background .12s, box-shadow .12s;
    box-shadow:0 2px 8px rgba(0,105,148,.1);
  }
  .key:hover{ background:rgba(72,202,228,.15); box-shadow:0 4px 12px rgba(0,105,148,.2); }
  .key:active{ transform:scale(.94); background:rgba(72,202,228,.25); }
  .key.zero{ grid-column:2; }

/* Emoji-replace icons */
.emi{ display:inline-block; vertical-align:middle; }
.hint{ margin-top:20px; font-size:12px; font-weight:600; color:var(--ink); opacity:0; transform:translateY(5px); display:flex; align-items:center; justify-content:center; gap:6px; transition:opacity .35s ease, transform .35s ease; }
.hint.show{ opacity:.65; transform:translateY(0); }
.hint-icon{ width:14px; height:14px; flex-shrink:0; }
.status{ min-height:20px; margin-top:10px; font-size:13px; font-weight:700; color:var(--ocean-deep); display:flex; align-items:center; justify-content:center; gap:6px; }
.status-icon{ width:16px; height:16px; flex-shrink:0; }

  .success-overlay{
    position:fixed; inset:0; background:rgba(0,65,107,.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    opacity:0; pointer-events:none; transition:opacity .5s ease; z-index:100;
    backdrop-filter:blur(5px);
  }
  .success-overlay.show{ opacity:1; pointer-events:all; }
  .success-overlay .success-icon{ width:80px; height:80px; }
  .success-overlay p{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:22px; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.3); }
  .success-overlay .success-sub{ font-size:14px; color:var(--ocean-bright); font-weight:600; }

  #music{
    position:fixed; left:0; bottom:0; width:1px; height:1px;
    opacity:0; pointer-events:none;
  }

  #stage{
    position:fixed; inset:0; width:100%; height:100%;
    border:0; background:var(--ocean-deep);
    opacity:0; visibility:hidden; z-index:1;
    transition:opacity .55s ease, visibility .55s ease;
  }
  body.in-site #stage{ opacity:1; visibility:visible; }
  body.in-site .card,
  body.in-site .ocean-animals,
  body.in-site .deco-img,
  body.in-site .ocean-rays,
  body.in-site .ocean-bg-layer,
  body.in-site .success-overlay{ display:none; }

  .music-hint{
    position:fixed; left:50%; bottom:20px; z-index:120;
    transform:translate(-50%, 14px);
    margin:0; padding:11px 18px; border-radius:999px;
    background:rgba(0,45,74,.92); color:var(--ocean-pale);
    font-size:12px; font-weight:600; text-align:center;
    opacity:0; pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
  }
  .music-hint.show{ opacity:1; transform:translate(-50%, 0); pointer-events:auto; }

  .ocean-animals{ position:absolute; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:18px; opacity:.55; z-index:5; pointer-events:none; animation:floatHoriz 20s ease-in-out infinite; }
  @keyframes floatHoriz{ 0%,100%{ transform:translateX(-50%) translateY(0); } 50%{ transform:translateX(-50%) translateY(-8px); } }
  .ocean-animals svg,.ocean-animals img{ width:28px; height:28px; }

  .deco-img{
    position:fixed; z-index:2; pointer-events:none;
    filter:drop-shadow(0 12px 24px rgba(0,40,90,.35));
    border-radius:20px;
    background: var(--ocean-pale);
  }
  .deco-img.img1{ width:85px; top:7%; left:4%; animation:decoFloat1 8s ease-in-out infinite; opacity:.8; }
  .deco-img.img2{ width:95px; top:9%; right:4%; animation:decoFloat2 9.5s ease-in-out infinite; opacity:.8; }
  .deco-img.img4{ width:75px; bottom:13%; right:5%; animation:decoFloat1 8.5s ease-in-out infinite reverse; animation-delay:-3s; opacity:.85; }
  .deco-img.img5{ width:75px; top:48%; left:2%; animation:decoFloat1 11s ease-in-out infinite; opacity:.7; }
  .deco-img.img6{ width:80px; top:32%; right:2%; animation:decoFloat2 10s ease-in-out infinite; opacity:.7; }
  .deco-img.img7{ width:52px; top:24%; left:4%; animation:decoSpin 18s linear infinite; opacity:.65; }
  .deco-img.img8{ width:65px; bottom:7%; left:4%; animation:decoFloat2 10.5s ease-in-out infinite reverse; opacity:.75; }
  @keyframes decoFloat1{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-18px) rotate(5deg); } }
  @keyframes decoFloat2{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-20px) rotate(-5deg); } }
  @keyframes decoSpin{ 0%{ transform:rotate(0deg); } 100%{ transform:rotate(360deg); } }

  @media (prefers-reduced-motion: reduce){
    .mascot.shake,.mascot.yay,.bubble,.fauna-fish,.jelly,.starfish-dec,.ocean-animals,.deco-img,.card-peeker,.card-corner-dec{ animation:none!important; }
  }
  @media (max-width:420px){ .card{ padding:28px 20px 24px; } h1{ font-size:20px; } .card-peeker{ width:60px; height:60px; top:-30px; right:-15px; } .card-corner-dec{ width:55px; height:55px; bottom:-22px; left:-18px; } }
</style>
</head>
<body>

<div class="ocean-rays"></div>
<div class="ocean-bg-layer" id="oceanBg"></div>

<div class="ocean-animals" id="oceanAnimals"></div>

<img class="deco-img img1" src="./assets/images/5.png" alt="" />
<img class="deco-img img2" src="./assets/images/4.png" alt="" />
<img class="deco-img img4" src="./assets/images/6.png" alt="" />
<img class="deco-img img5" src="./assets/images/9.png" alt="" />
<img class="deco-img img6" src="./assets/images/8.png" alt="" />
<img class="deco-img img7" src="./assets/images/7.png" alt="" />
<img class="deco-img img8" src="./assets/images/3.png" alt="" />

<div class="card">
  <h1>ayooo ayang tebak<br>passwordnya!</h1>
  <p class="subtitle">kalau salah, ayang selam <svg style="width:14px;height:14px;vertical-align:-2px" viewBox="0 0 24 24" fill="#FF6B6B"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></p>

  <img class="mascot" id="mascot" src="./assets/images/1.png" alt="mascot" />

  <div class="card-peeker"><img src="./assets/images/5.png" alt="" /></div>
  <div class="card-corner-dec"><img src="./assets/images/4.png" alt="" /></div>

  <div class="dots" id="dots">
    <span class="dot"><img src="./assets/images/1.png" alt="" /></span>
    <span class="dot"><img src="./assets/images/1.png" alt="" /></span>
    <span class="dot"><img src="./assets/images/1.png" alt="" /></span>
    <span class="dot"><img src="./assets/images/1.png" alt="" /></span>
  </div>

  <div class="pad" id="pad">
    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key zero" data-k="0">0</button>
    <button class="key" data-action="backspace" aria-label="Hapus digit terakhir">⌫</button>
  </div>

  <p class="status" id="status">&nbsp;</p>
  <p class="hint" id="hint"><svg class="hint-icon" viewBox="0 0 24 24" fill="none" stroke="#0096C7" stroke-width="2
    "><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12" 
    y2="16"/></svg><span>hint muncul kalo udah 3x salah!</span></p>

</div>

<div class="success-overlay" id="successOverlay">
  <svg class="success-icon" viewBox="0 0 80 80" fill="none">
    <circle cx="40" cy="40" r="36" fill="#48CAE4" opacity=".3" stroke="#fff" stroke-width="3"/>
    <path d="M24 40 L36 52 L56 30" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <p>bener bangettt yeayy!</p>
  <p class="success-sub">selamat! kau bisa menyelam lebih dalam lagi</p>
</div>

<iframe id="stage" title="isi surat" src="about:blank"></iframe>

<audio id="music" loop preload="auto" src="./assets/music/The%201975%20-%20About%20You%20(Official).mp3"></audio>

<p class="music-hint" id="musicHint">musiknya belum jalan? ketuk di sini</p>

<script>
const CORRECT_PASSWORD = "0101";
const REDIRECT_URL = "love-letter.html";
const IS_SHELL = window.self === window.top;
const oceanBg = document.getElementById('oceanBg');
const oceanAnimals = document.getElementById('oceanAnimals');
const music = document.getElementById('music');
const stage = document.getElementById('stage');
const musicHint = document.getElementById('musicHint');
let musicStarted = false;

function showMusicHint(){
  if(!IS_SHELL) return;
  musicHint.classList.add('show');
  const unlock = () => {
    musicHint.classList.remove('show');
    const attempt = music.play();
    if(attempt && attempt.catch) attempt.catch(() => {});
  };
  document.addEventListener('pointerdown', unlock, { once:true });
  document.addEventListener('keydown', unlock, { once:true });
}

function startMusic(){
  if(!IS_SHELL || musicStarted) return;
  musicStarted = true;
  music.volume = 0.6;
  music.currentTime = 0;
  const attempt = music.play();
  if(attempt && attempt.catch) attempt.catch(showMusicHint);
}

function enterSite(){
  if(!IS_SHELL){
    window.location.href = REDIRECT_URL;
    return;
  }
  stage.addEventListener('load', () => {
    document.body.classList.add('in-site');
    overlay.classList.remove('show');
  }, { once:true });
  stage.src = REDIRECT_URL;
}

/* ===== Bubbles ===== */
for(let i = 0; i < 28; i++){
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = Math.random() * 18 + 6;
  b.style.width = size + 'px'; b.style.height = size + 'px';
  b.style.left = Math.random() * 100 + '%';
  b.style.animationDuration = (Math.random() * 10 + 8) + 's';
  b.style.animationDelay = (Math.random() * 12) + 's';
  oceanBg.appendChild(b);
}

/* ===== Fauna pakai gambar assets ===== */
const faunaImgs = ['./assets/images/4.png','./assets/images/5.png','./assets/images/3.png','./assets/images/6.png'];

for(let i = 0; i < 8; i++){
  const f = document.createElement('img');
  f.className = 'fauna-fish';
  f.src = faunaImgs[i % faunaImgs.length];
  f.alt = '';
  f.style.top = (Math.random() * 65 + 8) + '%';
  f.style.animationDuration = (Math.random() * 18 + 14) + 's';
  f.style.animationDelay = (Math.random() * 12) + 's';
  const w = Math.random() * 40 + 50;
  f.style.width = w + 'px';
  f.style.height = w + 'px';
  oceanBg.appendChild(f);
}

for(let i = 0; i < 5; i++){
  const j = document.createElement('img');
  j.className = 'jelly';
  j.src = faunaImgs[(i + 2) % faunaImgs.length];
  j.alt = '';
  j.style.left = (Math.random() * 90 + 5) + '%';
  j.style.animationDuration = (Math.random() * 14 + 18) + 's';
  j.style.animationDelay = (Math.random() * 10) + 's';
  const w = Math.random() * 30 + 50;
  j.style.width = w + 'px';
  j.style.height = w + 'px';
  oceanBg.appendChild(j);
}

for(let i = 0; i < 4; i++){
  const im = document.createElement('img');
  im.src = faunaImgs[i % faunaImgs.length];
  im.alt = '';
  im.style.width = '28px'; im.style.height = '28px';
  im.style.animationDelay = (i * 0.5) + 's';
  im.style.opacity = (Math.random() * 0.3 + 0.4) + '';
  oceanAnimals.appendChild(im);
}

const dotsEl = document.querySelectorAll('#dots .dot');
const statusEl = document.getElementById('status');
const mascot = document.getElementById('mascot');
const overlay = document.getElementById('successOverlay');
let entered = '';
let wrongCount = 0;
const hintEl = document.getElementById('hint');
const HINT_TEXT = 'hint : tanggall anniv kitaa dongg!';

function renderDots(){
  dotsEl.forEach((d, i) => { d.classList.toggle('filled', i < entered.length); d.classList.remove('wrong'); });
}

function wrongShake(){
  dotsEl.forEach((d) => d.classList.add('wrong'));
  mascot.classList.remove('shake');
  void mascot.offsetWidth;
  mascot.classList.add('shake');
  wrongCount++;
  statusEl.innerHTML = '<svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="#e0576f" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' + (wrongCount >= 3 ? ' hmm masih belum... tapi ini hint! coba lagi ya' : ' hmm bukan itu deh...');
  if(wrongCount === 3){ hintEl.querySelector('span').textContent = HINT_TEXT; hintEl.classList.add('show'); }
  setTimeout(() => { entered = ''; renderDots(); statusEl.innerHTML = '&nbsp;'; }, 650);
}

function correctEntry(){
  mascot.classList.add('yay');
  statusEl.innerHTML = '<svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="#2A9D8F" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> yeayy bener sayang!';
  startMusic();
  setTimeout(() => {
    overlay.classList.add('show');
    setTimeout(enterSite, 1500);
  }, 350);
}

function deleteLastDigit(){
  entered = entered.slice(0, -1);
  renderDots();
  statusEl.innerHTML = '&nbsp;';
}

document.getElementById('pad').addEventListener('click', (e) => {
  const btn = e.target.closest('.key');
  if(!btn) return;
  if(btn.dataset.action === 'backspace'){
    deleteLastDigit();
    return;
  }
  if(entered.length >= CORRECT_PASSWORD.length) return;
  entered += btn.dataset.k;
  renderDots();
  if(entered.length === CORRECT_PASSWORD.length){
    entered === CORRECT_PASSWORD ? correctEntry() : wrongShake();
  }
});

window.addEventListener('keydown', (e) => {
  if(e.key === 'Backspace' || e.key === 'Delete'){
    e.preventDefault();
    deleteLastDigit();
    return;
  }
  if(/^[0-9]$/.test(e.key)){
    const btn = document.querySelector('.key[data-k="' + e.key + '"]');
    if(btn) btn.click();
  }
});
</script>

</body>
</html>
