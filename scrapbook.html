<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Little Scrapbook</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Patrick+Hand&family=Quicksand:wght@500;600;700&display=swap');

  :root{
    --ocean-deep:#00416B;
    --ocean-mid:#0077B6;
    --ocean-bright:#48CAE4;
    --ocean-pale:#CAF0F8;
    --coral:#FF6B6B;
    --seafoam:#2A9D8F;
    --cream:#EAF6FA;
    --cream-2:#F7FDFF;
    --ink:#002D4A;
    --olive:#7C8A5A;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:'Quicksand', sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px 12px;
    color:var(--ink);
    background:
      url('./assets/images/2.png') center / cover no-repeat fixed,
      linear-gradient(180deg, rgba(0,65,107,.6) 0%, rgba(0,119,182,.45) 55%, rgba(72,202,228,.4) 100%);
  }

  .frame{
    position:relative; width:100%; max-width:430px;
    padding:16px; border-radius:8px; background:#062A44;
    box-shadow:0 34px 60px -30px rgba(0,0,0,.55);
  }

  .mat{
    position:relative; min-height:560px; overflow:hidden;
    background:var(--cream); border-radius:2px;
    box-shadow:inset 0 0 30px rgba(0,0,0,.08);
  }
  .mat::before{
    content:''; position:absolute; inset:0; opacity:.9; pointer-events:none;
    background-image:
      radial-gradient(circle at 12% 10%, rgba(72,202,228,.12) 0 6px, transparent 7px),
      radial-gradient(circle at 85% 6%, rgba(72,202,228,.12) 0 6px, transparent 7px),
      radial-gradient(circle at 92% 40%, rgba(72,202,228,.12) 0 5px, transparent 6px),
      radial-gradient(circle at 6% 55%, rgba(255,107,107,.13) 0 5px, transparent 6px),
      radial-gradient(circle at 88% 82%, rgba(72,202,228,.12) 0 6px, transparent 7px),
      radial-gradient(circle at 8% 88%, rgba(72,202,228,.14) 0 5px, transparent 6px);
  }

  .board{ position:relative; padding:24px 18px 28px; }

  .tile{
    position:relative; background:#fff;
    box-shadow:0 10px 20px -8px rgba(0,0,0,.28);
  }
  .tile.plain{ padding:0; border-radius:2px; }
  .tile.polaroid{ padding:7px 7px 22px; border-radius:2px; }
  .tile .ph{
    width:100%; height:100%;
    background-color:#E4F2F9;
    background-repeat:no-repeat; background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center; color:#8FB8C8;
  }
  .tile .ph svg{ width:22%; height:22%; opacity:.5; }
  .tile .ph.has-photo svg{ display:none; }
  .tile.polaroid .ph{ aspect-ratio:1/1; }

  .ph[data-photo="sb1"]{ background-image:url('./assets/photos/scrapbook-1.jpg'),url('./assets/photos/scrapbook-1.png'); }
  .ph[data-photo="sb2"]{ background-image:url('./assets/photos/scrapbook-2.jpg'),url('./assets/photos/scrapbook-2.png'); }
  .ph[data-photo="sb3"]{ background-image:url('./assets/photos/scrapbook-3.jpg'),url('./assets/photos/scrapbook-3.png'); }
  .ph[data-photo="sb4"]{ background-image:url('./assets/photos/scrapbook-4.jpg'),url('./assets/photos/scrapbook-4.png'); }
  .ph[data-photo="sb5"]{ background-image:url('./assets/photos/scrapbook-5.jpg'),url('./assets/photos/scrapbook-5.png'); }
  .ph[data-photo="sb6"]{ background-image:url('./assets/photos/scrapbook-6.jpg'),url('./assets/photos/scrapbook-6.png'); }
  .ph[data-photo="sb7"]{ background-image:url('./assets/photos/scrapbook-7.jpg'),url('./assets/photos/scrapbook-7.png'); }
  .ph[data-photo="sb8"]{ background-image:url('./assets/photos/scrapbook-8.jpg'),url('./assets/photos/scrapbook-8.png'); }

  .sticker{
    position:absolute; z-index:6; pointer-events:none;
    width:calc(var(--w) * var(--k, 1));
    filter:drop-shadow(0 8px 10px rgba(0,0,0,.4));
  }
  .sticker img{ display:block; width:100%; height:auto; }
  .sticker.s1{ left:-16px; top:6px;    --w:78px; transform:rotate(-12deg); }
  .sticker.s2{ left:50%;   top:-10px;  --w:132px; transform:translateX(-50%) rotate(3deg); }
  .sticker.s3{ right:-14px; top:12px;   --w:96px; transform:rotate(9deg); }
  .sticker.s4{ left:-15px; top:158px;  --w:66px; transform:rotate(-8deg); }
  .sticker.s5{ left:-18px; bottom:118px; --w:60px; transform:rotate(7deg); }
  .sticker.s6{ right:-17px; top:336px; --w:58px; transform:rotate(6deg); }
  .sticker.s7{ right:-12px; bottom:108px; --w:72px; transform:rotate(-10deg); }
  .sticker.s8{ left:26px;  bottom:-16px; --w:82px; transform:rotate(5deg); }
  .sticker.s9{ right:26px; bottom:-20px; --w:66px; transform:rotate(-6deg); }

  .r1{ display:flex; gap:8px; margin-bottom:10px; }
  .r1 .tile.plain{ width:54%; height:150px; transform:rotate(-3deg); }
  .r1 .stack{ flex:1; display:flex; flex-direction:column; gap:8px; }
  .r1 .stack .tile.plain{ width:100%; height:70px; transform:rotate(2deg); }

  .r2{ display:flex; gap:8px; margin:0 0 10px; position:relative; z-index:2; }
  .r2 .tile.polaroid{ width:56%; transform:rotate(2.5deg); }
  .r2 .tile.plain{ flex:1; height:120px; transform:rotate(-2deg); align-self:flex-end; }

  .r3{ display:flex; gap:8px; margin-bottom:10px; align-items:flex-start; }
  .r3 .tile.plain.small{ width:34%; height:110px; transform:rotate(-4deg); }
  .sticker-lips{ flex:1; display:flex; align-items:center; justify-content:center; gap:4px; padding-top:10px; }
  .r3 .tile.plain.right{ width:34%; height:130px; transform:rotate(3deg); }

  .r4{ display:flex; gap:10px; margin-bottom:10px; align-items:flex-end; }
  .heart-tag{
    width:40%; aspect-ratio:1/1; background:var(--cream-2);
    clip-path:path('M50 90 C10 65 0 35 20 18 C35 5 50 15 50 28 C50 15 65 5 80 18 C100 35 90 65 50 90 Z');
    display:flex; align-items:center; justify-content:center;
    padding:14px; transform:rotate(-3deg);
    box-shadow:0 8px 16px -6px rgba(0,0,0,.25);
  }
  .heart-tag p{ margin:0; font-size:9.5px; line-height:1.5; text-align:left; color:var(--ink); }
  .heart-tag b{ font-weight:700; }
  .heart-tag i{ font-style:italic; color:var(--coral); }
  .r4 .tile.plain{ flex:1; height:150px; transform:rotate(2deg); }

  .r5{ display:flex; gap:8px; margin-top:0; }
  .r5 .tile.plain{ width:38%; height:110px; transform:rotate(-3deg); }
  .tape{
    flex:1; align-self:center; padding:12px 10px;
    background:#D8F1F7; border:1px solid rgba(0,119,182,.12);
    transform:rotate(-2deg); box-shadow:0 6px 14px -6px rgba(0,0,0,.2);
    text-align:center;
  }
  .tape span{ font-family:'Caveat', cursive; font-weight:700; font-size:22px; color:var(--ink); }

  .label{
    position:absolute; z-index:3; font-family:'Patrick Hand', cursive;
    color:var(--ink); font-size:13px; line-height:1.3; text-align:center;
  }
  .label.when-around{ top:44px; right:18px; width:100px; transform:rotate(-4deg); }
  .label .paw{ display:block; margin:0 auto 2px; width:16px; height:16px; }
  .label.when-not{ top:232px; right:14px; width:100px; transform:rotate(-2deg); }
  .love-you{
    position:absolute; z-index:3; top:260px; right:12px;
    font-family:'Caveat', cursive; font-weight:700; font-size:19px;
    color:var(--coral); transform:rotate(-3deg);
  }

  .lip{ width:34px; height:22px; transform:rotate(-8deg); filter:drop-shadow(0 3px 4px rgba(0,0,0,.25)); }
  .lip.r{ transform:rotate(10deg); margin-top:10px; }

  .footer-line{
    text-align:center; padding:16px 10px 4px;
    font-family:'Caveat', cursive; font-size:16px; color:var(--ink); opacity:.7;
  }

  .loop-btn{
    display:flex; justify-content:center; width:100%; margin:12px 0 0;
    padding:13px 20px; border-radius:999px;
    text-decoration:none; font-size:14px; font-weight:700;
    background:linear-gradient(135deg, var(--ocean-bright) 0%, var(--ocean-mid) 100%);
    color:#fff; box-shadow:0 10px 18px -14px rgba(0,0,0,.45);
    transition:transform .15s ease, filter .15s ease;
  }
  .loop-btn:hover{ filter:brightness(1.08); transform:translateY(-2px); }
  .loop-btn:focus-visible{ outline:3px solid rgba(227,171,107,.9); outline-offset:3px; }

  @media (max-width:380px){
    body{ padding:12px 8px; }
    .frame{ padding:10px; }
    .mat{ min-height:520px; }
    .board{ padding:16px 12px 20px; }
    .r1 .tile.plain{ height:130px; }
    .r1 .stack .tile.plain{ height:60px; }
    .r2 .tile.plain{ height:108px; }
    .r3 .tile.plain.small{ height:96px; }
    .r3 .tile.plain.right{ height:114px; }
    .r4 .tile.plain{ height:132px; }
    .r5 .tile.plain{ height:96px; }
    .heart-tag p{ font-size:8.5px; }
    .sticker{ --k:.72; }
    .sticker.s1{ left:-8px; top:2px; }
    .sticker.s2{ top:0; }
    .sticker.s3{ right:-8px; top:8px; }
    .sticker.s4{ left:-6px; top:150px; }
    .sticker.s5{ left:-8px; bottom:112px; }
    .sticker.s6{ right:-6px; top:330px; }
    .sticker.s7{ right:-4px; bottom:102px; }
    .sticker.s8{ left:14px; bottom:-10px; }
    .sticker.s9{ right:14px; bottom:-12px; }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="mat">
    <div class="board">
      <div class="r1">
        <div class="tile plain">
          <div class="ph" data-photo="sb1" role="img" aria-label="Slot foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-6 6"/></svg></div>
        </div>
        <div class="stack">
          <div class="tile plain">
            <div class="ph" data-photo="sb2" role="img" aria-label="Slot foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-6 6"/></svg></div>
          </div>
        </div>
      </div>

      <span class="label when-around">
        <svg class="paw" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>
        when you are around
      </span>

      <div class="r2">
        <div class="tile polaroid">
          <div class="ph" data-photo="sb3" role="img" aria-label="Slot foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-6 6"/></svg></div>
        </div>
        <div class="tile plain">
          <div class="ph" data-photo="sb4" role="img" aria-label="Slot foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-6 6"/></svg></div>
        </div>
      </div>

      <span class="label when-not">when you aren't</span>
      <span class="love-you">i love you sooo much</span>

      <div class="r3">
        <div class="tile plain small">
          <div class="ph" data-photo="sb5" role="img" aria-label="Slot foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-6 6"/></svg></div>
        </div>
        <div class="sticker-lips">
          <svg class="lip l" viewBox="0 0 40 24"><path d="M2 12 C6 2 14 2 20 8 C26 2 34 2 38 12 C34 18 30 22 20 20 C10 22 6 18 2 12 Z" fill="#C81F3F"/><path d="M20 8 C22 12 22 14 20 20 C18 14 18 12 20 8 Z" fill="#A01633"/></svg>
          <svg class="lip r" viewBox="0 0 40 24"><path d="M2 12 C6 2 14 2 20 8 C26 2 34 2 38 12 C34 18 30 22 20 20 C10 22 6 18 2 12 Z" fill="#E0304F"/><path d="M20 8 C22 12 22 14 20 20 C18 14 18 12 20 8 Z" fill="#B81F3A"/></svg>
        </div>
        <div class="tile plain right">
          <div class="ph" data-photo="sb6" role="img" aria-label="Slot foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-6 6"/></svg></div>
        </div>
      </div>

      <div class="r4">
        <div class="heart-tag">
          <p><b>love·able</b> /ˈlʌvəb(ə)l/<br><i>adj.</i> — mudah banget buat disayang<br><br><b>love</b> /lʌv/<br><i>n.</i> — perasaan yang tumbuh tiap hari buat satu orang yang spesial</p>
        </div>
        <div class="tile plain">
          <div class="ph" data-photo="sb7" role="img" aria-label="Slot foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-6 6"/></svg></div>
        </div>
      </div>

      <div class="r5">
        <div class="tile plain">
          <div class="ph" data-photo="sb8" role="img" aria-label="Slot foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8c0-2 2-3 3-1s1 4-1 5-3-2-2-4z"/><path d="M20 8c0-2-2-3-3-1s-1 4 1 5 3-2 2-4z"/><path d="M6 14c0-5 4-8 6-8s6 3 6 8-3 6-6 6-6-1-6-6z"/></svg></div>
        </div>
        <div class="tape"><span>my favorite person hehe</span></div>
      </div>
    </div>

    <a class="loop-btn" href="harapan.html">buka doa &amp; harapan kita</a>
  </div>

  <span class="sticker s1"><img src="./assets/images/1.png" alt=""></span>
  <span class="sticker s2"><img src="./assets/images/2.png" alt=""></span>
  <span class="sticker s3"><img src="./assets/images/5.png" alt=""></span>
  <span class="sticker s4"><img src="./assets/images/4.png" alt=""></span>
  <span class="sticker s5"><img src="./assets/images/7.png" alt=""></span>
  <span class="sticker s6"><img src="./assets/images/6.png" alt=""></span>
  <span class="sticker s7"><img src="./assets/images/8.png" alt=""></span>
  <span class="sticker s8"><img src="./assets/images/9.png" alt=""></span>
  <span class="sticker s9"><img src="./assets/images/3.png" alt=""></span>
</div>

<script>
document.querySelectorAll('[data-photo]').forEach((slot) => {
  const name = slot.getAttribute('data-photo');
  const probe = new Image();
  probe.onload = () => slot.classList.add('has-photo');
  probe.src = './assets/photos/' + name + '.jpg';
  probe.onerror = () => {
    const alt = new Image();
    alt.onload = () => slot.classList.add('has-photo');
    alt.src = './assets/photos/' + name + '.png';
  };
});
</script>
</body>
</html>
