<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surat Anniversary Untukmu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap');

  :root{
    --ocean-deep:#00416B;
    --ocean-mid:#0077B6;
    --ocean-light:#0096C7;
    --ocean-bright:#48CAE4;
    --ocean-pale:#CAF0F8;
    --coral:#FF6B6B;
    --seafoam:#2A9D8F;
    --gold:#E3AB6B;
    --ink:#002D4A;
    --ink-soft:#3C6478;
    --paper:#FFFDF8;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  html{ scroll-behavior:smooth; }

  body{
    min-height:100vh;
    font-family:'Quicksand', sans-serif;
    position:relative; overflow-x:hidden;
    color:var(--ink);
    background:
      url('./assets/images/2.png') center / cover no-repeat fixed,
      linear-gradient(180deg, rgba(0,65,107,.6) 0%, rgba(0,119,182,.52) 48%, rgba(72,202,228,.42) 100%);
  }

  .ocean-rays{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 0%, rgba(202,240,248,.3) 0%, rgba(72,202,228,.08) 48%, transparent 72%);
  }

  .field{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }

  .bubble{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.6) 0%, rgba(202,240,248,.25) 45%, rgba(72,202,228,.1) 75%, transparent 100%);
    border:1px solid rgba(255,255,255,.35);
    box-shadow:0 0 10px rgba(255,255,255,.3) inset, 0 3px 10px rgba(0,0,0,.2);
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{ transform:translateY(105vh) translateX(0) scale(.3); opacity:0; }
    15%{ opacity:.8; }
    50%{ transform:translateY(50vh) translateX(12px) scale(.9); }
    85%{ opacity:.8; }
    100%{ transform:translateY(-15vh) translateX(-10px) scale(1.1); opacity:0; }
  }

  .fauna-fish{
    position:absolute; border-radius:50%; object-fit:cover;
    filter:drop-shadow(0 6px 12px rgba(0,30,70,.3));
    animation:swim linear infinite;
  }
  @keyframes swim{
    0%{ transform:translateX(-18vw) translateY(0) scaleX(1); }
    45%{ transform:translateX(108vw) translateY(-22px) scaleX(1); }
    55%{ transform:translateX(108vw) translateY(-22px) scaleX(-1); }
    100%{ transform:translateX(-18vw) translateY(10px) scaleX(-1); }
  }

  .jelly{
    position:absolute; object-fit:cover; opacity:.6;
    animation:jellyRise linear infinite;
  }
  @keyframes jellyRise{
    0%{ transform:translateY(110vh) scale(.85); opacity:0; }
    20%{ opacity:.85; }
    50%{ transform:translateY(50vh) scale(1.05); }
    80%{ opacity:.85; }
    100%{ transform:translateY(-20vh) scale(.95); opacity:0; }
  }

  .float-heart{
    position:absolute; opacity:0;
    animation:rise linear infinite;
  }
  .float-heart svg{ display:block; width:100%; height:100%; }
  @keyframes rise{
    0%{ transform:translateY(10vh) scale(.8) rotate(0deg); opacity:0; }
    12%{ opacity:.8; }
    88%{ opacity:.5; }
    100%{ transform:translateY(-108vh) scale(1) rotate(12deg); opacity:0; }
  }

  .spark{
    position:absolute; width:3px; height:3px;
    border-radius:50%; background:var(--gold);
    animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{ opacity:.15; } 50%{ opacity:.9; } }

  .next-btn:focus-visible{
    outline:3px solid rgba(255,201,143,.9); outline-offset:3px;
  }

  .hero{
    position:relative; z-index:1;
    min-height:48vh; padding:36px 24px 4px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:#fff;
  }
  .route{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .route svg{ width:22px; height:22px; color:var(--ocean-pale); }
  .route .dashes{ width:62px; border-top:2px dashed rgba(202,240,248,.65); }
  .eyebrow{
    font-family:'Quicksand', sans-serif; font-weight:700; font-size:13px;
    letter-spacing:.16em; color:var(--ocean-pale); margin:0 0 10px;
  }
  h1{
    margin:0; font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size:clamp(44px, 10vw, 70px); line-height:1.02;
    color:#fff;
  }
  .counter{
    margin:12px 0 0; font-size:15px; font-weight:600; color:var(--ocean-pale);
  }
  .counter strong{
    font-family:'Baloo 2', sans-serif; font-size:22px; color:var(--gold);
  }
  .scroll-hint{
    margin:18px 0 0; font-size:11px; letter-spacing:.16em;
    color:rgba(202,240,248,.8);
  }
  .scroll-hint svg{ width:14px; height:14px; margin-top:6px; animation:hintDrift 1.6s ease-out infinite; }
  @keyframes hintDrift{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(4px); } }

  .letter-section{
    position:relative; z-index:1;
    min-height:auto; padding:8px 20px 90px;
    display:flex; align-items:flex-start; justify-content:center;
  }
  .letter{
    position:relative; width:100%; max-width:620px;
    background:var(--paper); border:1px solid rgba(72,202,228,.22);
    border-radius:18px; padding:46px 42px;
    box-shadow:0 34px 62px -28px rgba(0,0,0,.35);
  }
  .letter::before{
    content:''; position:absolute; inset:10px;
    border:1px solid rgba(227,171,107,.38); border-radius:12px; pointer-events:none;
  }
  .letter .to{
    margin:0 0 22px; font-size:22px; font-weight:700; font-style:italic;
    color:var(--coral);
  }
  .letter p{
    margin:0 0 20px; min-height:1.8em;
    font-size:17px; line-height:1.8; color:var(--ink-soft);
  }
  .letter .sign{
    margin:26px 0 0; font-size:22px; line-height:1.45; font-weight:700;
    font-style:italic; color:var(--coral);
  }
  .caret{
    display:inline-block; width:2px; height:1em; margin-left:2px;
    vertical-align:text-bottom; background:var(--coral);
    animation:blink 1s step-end infinite;
  }
  .caret.done{ display:none; }
  @keyframes blink{ 50%{ opacity:0; } }
  .heart-end{
    display:flex; justify-content:center; margin-top:24px; opacity:0;
    transition:opacity .8s ease;
  }
  .heart-end.show{ opacity:1; }
  .heart-end svg{ width:30px; height:30px; color:var(--coral); }
  .next-btn{
    display:flex; justify-content:center; width:100%; margin-top:26px; padding:14px 22px;
    border-radius:999px; text-decoration:none;
    background:linear-gradient(135deg, var(--ocean-bright) 0%, var(--ocean-light) 100%);
    color:#fff; font-weight:700; font-size:15px;
    box-shadow:0 10px 18px -14px rgba(0,0,0,.42);
    opacity:.35; pointer-events:none; transition:opacity .5s ease, transform .15s ease;
  }
  .next-btn.ready{ opacity:1; pointer-events:auto; }
  .next-btn:hover{ filter:brightness(1.08); transform:translateY(-2px); }

  @media (max-width:600px){
    h1{ font-size:44px; }
    .letter{ padding:34px 26px; }
    .letter .to{ font-size:20px; }
    .letter p{ font-size:16px; }
  }

  @media (prefers-reduced-motion: reduce){
    .bubble,.fauna-fish,.jelly,.float-heart,.spark,.scroll-hint svg,.caret{ animation:none!important; }
    .next-btn,.heart-end{ transition:none!important; }
  }
</style>
</head>
<body>
<div class="ocean-rays"></div>
<div class="field" id="field"></div>


<section class="hero">
  <div class="route" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
    <span class="dashes"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.6-10-9C.2 8.8 1.6 5 5.3 5c2 0 3.4 1 4.7 2.7C11.3 6 12.7 5 14.7 5 18.4 5 19.8 8.8 22 12c-2.5 4.4-10 9-10 9z"/></svg>
    <span class="dashes"></span>
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
  </div>
  <p class="eyebrow">surat kecil di hari jadi kita</p>
  <h1>Happy<br>Anniversary</h1>
  <p class="counter" id="counterText">menghitung hari bersama...</p>
  <p class="scroll-hint">GULIR UNTUK BACA SURATNYA<br><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></p>
</section>

<section class="letter-section" id="letterSection">
  <article class="letter">
    <p class="to">Untuk kamu, di hari anniversary kita,</p>
    <div id="typedArea" aria-live="polite"></div>
    <p class="sign" id="signature">Dengan cinta yang bertambah setiap hari,<br>sayangmu.</p>
    <div class="heart-end" id="heartEnd" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9C.2 8.8 1.6 5 5.3 5c2 0 3.4 1 4.7 2.7C11.3 6 12.7 5 14.7 5 18.4 5 19.8 8.8 22 12c-2.5 4.4-10 9-10 9z"/></svg>
    </div>
    <a class="next-btn" id="nextBtn" href="scrapbook.html">buka scrapbook kita</a>
  </article>
</section>

<script>
const START_DATE = "2023-01-01";
const LETTER_PARAGRAPHS = [
  "Happy anniversary, sayangku. Setiap tahun yang kita lewati bersama selalu punya cerita, dan aku masih menyimpan setiap saat kecil yang pernah kita bagi.",
  "Dari obrolan ringan sampai tawa yang nggak ada habisnya, aku sadar bahwa kamu bukan cuma orang yang aku suka, tapi rumah yang bikin aku merasa aman.",
  "Terima kasih sudah jadi partner terbaik, orang yang selalu kupercaya, dan tempat paling tenang buat semua isi hatiku.",
  "Di hari anniversary ini, aku cuma mau bilang: semoga semua hal baik yang kamu inginkan selalu datang, dan aku selalu ada di sisi kamu.",
  "I love you, sayang. Terima kasih sudah menjadi bagian terbaik dalam hidupku."
];

const counterEl = document.getElementById('counterText');
function updateCounter(){
  const start = new Date(START_DATE + 'T00:00:00');
  const now = new Date();
  const diffDays = Math.max(0, Math.floor((now - start) / 86400000));
  counterEl.innerHTML = `sudah <strong>${diffDays.toLocaleString('id-ID')}</strong> hari kita bersama`;
}
updateCounter();

const typedArea = document.getElementById('typedArea');
const signature = document.getElementById('signature');
const heartEnd = document.getElementById('heartEnd');
const nextBtn = document.getElementById('nextBtn');
let started = false;

function typeParagraph(index){
  if(index >= LETTER_PARAGRAPHS.length){
    signature.style.transition = 'opacity 1s ease';
    signature.style.opacity = 1;
    heartEnd.classList.add('show');
    nextBtn.classList.add('ready');
    return;
  }
  const p = document.createElement('p');
  const caret = document.createElement('span');
  caret.className = 'caret';
  typedArea.appendChild(p);
  p.appendChild(caret);
  const text = LETTER_PARAGRAPHS[index];
  let i = 0;
  function tick(){
    if(i < text.length){
      caret.insertAdjacentText('beforebegin', text[i]);
      i++;
      setTimeout(tick, 26 + Math.random() * 22);
    } else {
      caret.classList.add('done');
      setTimeout(() => typeParagraph(index + 1), 450);
    }
  }
  tick();
}

if('IntersectionObserver' in window){
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if(entry.isIntersecting && !started){
        started = true;
        typeParagraph(0);
      }
    });
  }, { threshold: .3 });
  observer.observe(document.getElementById('letterSection'));
} else {
  typeParagraph(0);
}

const field = document.getElementById('field');
const heartPath = "M12 21s-7-4.4-9.3-8.6C.9 8.6 2.6 5 6.1 5c1.9 0 3.2 1 4.5 2.6C11.9 6 13.2 5 15.1 5c3.5 0 5.2 3.6 3.4 7.4C19 16.6 12 21 12 21z";
const heartColors = ["#FF6B6B", "#E3AB6B", "#48CAE4", "#2A9D8F"];
const faunaImgs = ['./assets/images/4.png', './assets/images/5.png', './assets/images/3.png', './assets/images/6.png'];
function rand(min, max){ return Math.random() * (max - min) + min; }

for(let i = 0; i < 18; i++){
  const h = document.createElement('div');
  h.className = 'float-heart';
  const size = rand(12, 26);
  h.style.width = size + 'px';
  h.style.height = size + 'px';
  h.style.left = rand(2, 96) + 'vw';
  h.style.animationDuration = rand(11, 24) + 's';
  h.style.animationDelay = rand(0, 16) + 's';
  h.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="${heartColors[i % heartColors.length]}" stroke-width="1.6"><path d="${heartPath}"/></svg>`;
  field.appendChild(h);
}

for(let i = 0; i < 26; i++){
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = rand(6, 20);
  b.style.width = size + 'px';
  b.style.height = size + 'px';
  b.style.left = rand(0, 100) + '%';
  b.style.animationDuration = rand(8, 18) + 's';
  b.style.animationDelay = rand(0, 12) + 's';
  field.appendChild(b);
}

for(let i = 0; i < 7; i++){
  const f = document.createElement('img');
  f.className = 'fauna-fish';
  f.src = faunaImgs[i % faunaImgs.length];
  f.alt = '';
  f.style.top = rand(8, 72) + '%';
  f.style.width = rand(46, 84) + 'px';
  f.style.height = f.style.width;
  f.style.animationDuration = rand(18, 30) + 's';
  f.style.animationDelay = rand(0, 12) + 's';
  field.appendChild(f);
}

for(let i = 0; i < 5; i++){
  const j = document.createElement('img');
  j.className = 'jelly';
  j.src = faunaImgs[(i + 2) % faunaImgs.length];
  j.alt = '';
  j.style.left = rand(4, 90) + '%';
  j.style.width = rand(32, 56) + 'px';
  j.style.height = j.style.width;
  j.style.animationDuration = rand(14, 22) + 's';
  j.style.animationDelay = rand(0, 10) + 's';
  field.appendChild(j);
}

for(let i = 0; i < 26; i++){
  const s = document.createElement('div');
  s.className = 'spark';
  s.style.left = rand(0, 100) + 'vw';
  s.style.top = rand(0, 100) + 'vh';
  s.style.animationDuration = rand(2, 5) + 's';
  s.style.animationDelay = rand(0, 4) + 's';
  field.appendChild(s);
}
</script>
</body>
</html>
